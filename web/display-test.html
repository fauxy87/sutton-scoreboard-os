<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCOREOS Display Test</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f3;
    color: #1c2b23;
}

header {
    background: #174f32;
    color: white;
    padding: 20px;
    text-align: center;
}

main {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 14px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

#patternName {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    color: #174f32;
}

#patternPosition,
#status {
    margin-top: 8px;
    text-align: center;
}

.score {
    margin-top: 18px;
    padding: 24px;
    border-radius: 12px;
    background: #101612;
    color: #f2c94c;
    text-align: center;
    font-family: monospace;
    font-size: 50px;
    font-weight: bold;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

button,
a {
    min-height: 54px;
    border: 0;
    border-radius: 10px;
    padding: 12px;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.primary {
    background: #174f32;
    color: white;
}

.secondary {
    background: #e5ebe7;
    color: #174f32;
}

.warning {
    background: #f2c94c;
    color: #28230c;
}

.restore {
    grid-column: 1 / -1;
    background: #b3261e;
    color: white;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.navigation {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.navigation a {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e5ebe7;
    color: #174f32;
}

#error {
    margin-top: 14px;
    text-align: center;
    color: #b3261e;
    font-weight: bold;
}

@media (max-width: 500px) {
    .controls,
    .navigation {
        grid-template-columns: 1fr;
    }

    .restore {
        grid-column: auto;
    }
}
</style>
</head>

<body>
<header>
    <h1>SCOREOS Display Test</h1>
    <div>Physical scoreboard test controls</div>
</header>

<main>
    <section class="card">
        <div id="patternName">Ready</div>
        <div id="patternPosition">Press Start Test</div>
        <div class="score" id="scorePreview">---</div>
        <div id="status">Live match remains protected</div>
        <div id="error"></div>
    </section>

    <section class="card controls">
        <button class="primary" id="start">▶ Start Test</button>
        <button class="warning" id="pause" disabled>⏸ Pause</button>
        <button class="secondary" id="previous">◀ Previous</button>
        <button class="secondary" id="next">Next ▶</button>
        <button class="restore" id="restore">
            Restore Live Match
        </button>
    </section>

    <section class="card navigation">
        <a href="/dashboard">Dashboard</a>
        <a href="/diagnostics">Diagnostics</a>
    </section>
</main>

<script>
let currentIndex = 0;
let patternCount = 1;
let timer = null;
let testStarted = false;
let automaticRunning = false;

const PATTERN_DELAY_MS = 3000;

const nameBox = document.getElementById("patternName");
const positionBox = document.getElementById("patternPosition");
const scoreBox = document.getElementById("scorePreview");
const statusBox = document.getElementById("status");
const errorBox = document.getElementById("error");

const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");
const nextButton = document.getElementById("next");
const previousButton = document.getElementById("previous");
const restoreButton = document.getElementById("restore");

function sleep(milliseconds) {
    return new Promise(
        (resolve) => setTimeout(resolve, milliseconds)
    );
}

async function control(action, index) {
    errorBox.textContent = "";

    const payload = {action};

    if (index !== undefined) {
        payload.index = index;
    }

    const response = await fetch(
        "/api/control",
        {
            method: "POST",
            cache: "no-store",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        }
    );

    let result;

    try {
        result = await response.json();
    } catch (error) {
        throw new Error(
            `Invalid response from SCOREOS (${response.status})`
        );
    }

    if (!response.ok || result.ok === false) {
        throw new Error(
            result.error ||
            result.message ||
            "Display command failed"
        );
    }

    return result;
}

function showPattern(result) {
    const test = result.test;
    const pattern = test.pattern;

    currentIndex = Number(test.index);
    patternCount = Number(test.count);

    nameBox.textContent = test.name;

    positionBox.textContent =
        `Pattern ${currentIndex + 1} of ${patternCount}`;

    scoreBox.textContent =
        `${pattern.total}/${pattern.wickets}`;

    statusBox.textContent =
        `Pattern ${currentIndex + 1} command sent to Arduino — ` +
        `visually check the physical scoreboard`;
}

function setControlsRunning(running) {
    startButton.disabled = running;
    pauseButton.disabled = !running;
    nextButton.disabled = running;
    previousButton.disabled = running;
    restoreButton.disabled = false;
}

async function loadSystemStatus() {
    try {
        const response = await fetch(
            "/api/system",
            {cache: "no-store"}
        );

        if (!response.ok) {
            return;
        }

        const system = await response.json();
        const arduino = system.arduino || {};

        if (arduino.connected === true) {
            statusBox.textContent =
                `Arduino connected: ` +
                `${arduino.device || "serial device ready"}. ` +
                `Press Start Test.`;
        } else {
            statusBox.textContent =
                "Arduino is not connected — the physical display " +
                "test may not work.";
        }
    } catch (error) {
        statusBox.textContent =
            "Unable to read Arduino status. Press Start Test to try.";
    }
}

async function startTest() {
    if (automaticRunning) {
        return;
    }

    automaticRunning = true;
    setControlsRunning(true);

    errorBox.textContent = "";
    nameBox.textContent = "Automatic Display Test";
    positionBox.textContent = "Starting";
    scoreBox.textContent = "---";

    statusBox.textContent =
        "Starting test — watch the physical scoreboard";

    try {
        const firstResult = await control(
            "display_test_start",
            0
        );

        testStarted = true;
        showPattern(firstResult);

        await sleep(PATTERN_DELAY_MS);

        for (
            let index = 1;
            index < patternCount;
            index += 1
        ) {
            if (!automaticRunning) {
                break;
            }

            const result = await control(
                "display_test_pattern",
                index
            );

            showPattern(result);
            await sleep(PATTERN_DELAY_MS);
        }

        if (automaticRunning) {
            automaticRunning = false;
            setControlsRunning(false);

            nameBox.textContent =
                "Automatic Test Completed";

            positionBox.textContent =
                `${patternCount} commands sent`;

            statusBox.textContent =
                "Test sequence completed. Confirm visually that " +
                "the physical scoreboard changed through every pattern, " +
                "then press Restore Live Match.";
        }
    } catch (error) {
        automaticRunning = false;
        setControlsRunning(false);

        errorBox.textContent = error.message;
        statusBox.textContent =
            "Display test stopped because a command failed.";
    }
}

function pauseTest() {
    automaticRunning = false;

    if (timer !== null) {
        clearTimeout(timer);
        timer = null;
    }

    setControlsRunning(false);

    if (testStarted) {
        statusBox.textContent =
            "Display test paused — the current pattern remains " +
            "on the physical scoreboard.";
    }
}

async function sendPattern(index) {
    pauseTest();

    try {
        let result;

        if (!testStarted) {
            result = await control(
                "display_test_start",
                index
            );

            testStarted = true;
        } else {
            result = await control(
                "display_test_pattern",
                index
            );
        }

        showPattern(result);
    } catch (error) {
        errorBox.textContent = error.message;
    }
}

async function restoreMatch() {
    pauseTest();

    try {
        const result = await control(
            "display_test_restore"
        );

        testStarted = false;
        automaticRunning = false;
        currentIndex = 0;
        patternCount = 1;

        nameBox.textContent = "Live Match Restored";
        positionBox.textContent =
            `Mode: ${result.mode}`;
        scoreBox.textContent = "LIVE";

        statusBox.textContent =
            "Restore command sent to Arduino — the saved live " +
            "match should now be displayed.";
    } catch (error) {
        errorBox.textContent = error.message;
    }
}

startButton.addEventListener(
    "click",
    startTest
);

pauseButton.addEventListener(
    "click",
    pauseTest
);

nextButton.addEventListener(
    "click",
    () => {
        const next =
            testStarted
                ? (currentIndex + 1) % patternCount
                : 0;

        sendPattern(next);
    }
);

previousButton.addEventListener(
    "click",
    () => {
        const previous =
            testStarted
                ? (
                    currentIndex - 1 + patternCount
                ) % patternCount
                : 0;

        sendPattern(previous);
    }
);

restoreButton.addEventListener(
    "click",
    restoreMatch
);

setControlsRunning(false);
loadSystemStatus();
</script>
</body>
</html>
