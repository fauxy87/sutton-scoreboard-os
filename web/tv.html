<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1"
>
<title>SCOREOS TV</title>

<style>
:root {
    --green: #0b5d38;
    --green-dark: #063c25;
    --gold: #f2c94c;
    --panel: #171a19;
    --panel-soft: #222624;
    --muted: #b9c0bc;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    margin: 0;
}

body {
    background: #090b0a;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background:
        linear-gradient(
            90deg,
            var(--green-dark),
            var(--green)
        );
    border-bottom: 4px solid var(--gold);
}

.brand {
    font-size: clamp(24px, 3vw, 36px);
    font-weight: 900;
    letter-spacing: 1px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 18px;
}

.live {
    font-size: clamp(16px, 2vw, 22px);
    font-weight: 800;
}

.clock {
    font-size: clamp(17px, 2vw, 24px);
    font-weight: 800;
}

.mode-controls {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 9px;
    padding: 10px;
    background: #101311;
}

.mode-controls button {
    border: 1px solid #59625d;
    border-radius: 8px;
    padding: 9px 16px;
    background: #262b28;
    color: white;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

.mode-controls button.active {
    background: var(--green);
    border-color: var(--gold);
}
.screen-layout.split-mode {
    grid-template-columns: 1fr;
    grid-template-rows: minmax(420px, 62vh) auto;
}

.split-mode .camera-panel {
    min-height: 420px;
    height: 62vh;
}

.split-mode .camera-preview {
    min-height: 420px;
    height: 62vh;
    object-fit: contain;
}

.split-mode .score-panel {
    width: 100%;
}

}

.score-panel {
    min-width: 0;
}

.score-strip {
    height: 100%;
    background: var(--panel);
    padding: 22px 28px;
    border-top: 1px solid #303531;
}

.match-line {
    display: flex;
    justify-content: space-between;
    align-items: end;
    gap: 20px;
    margin-bottom: 18px;
}

.teams {
    font-size: clamp(20px, 2.3vw, 30px);
    font-weight: 800;
}

.score-main {
    font-size: clamp(46px, 5vw, 70px);
    font-weight: 900;
    white-space: nowrap;
}

.overs {
    color: var(--muted);
    font-size: clamp(20px, 2.3vw, 30px);
    margin-left: 8px;
}

.details-grid {
    display: grid;
    grid-template-columns: 2fr 1.2fr 1fr;
    gap: 18px;
}

.panel {
    background: var(--panel-soft);
    border-radius: 14px;
    padding: 16px 18px;
}

.panel-title {
    color: var(--gold);
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
}

.player-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid #353a37;
}

.player-row:last-child {
    border-bottom: 0;
}

.player-name {
    font-size: clamp(19px, 2vw, 26px);
    font-weight: 800;
}

.player-runs {
    font-size: clamp(23px, 2.4vw, 32px);
    font-weight: 900;
}

.player-balls {
    color: var(--muted);
    font-size: clamp(17px, 1.8vw, 22px);
}

.stat {
    display: flex;
    justify-content: space-between;
    gap: 18px;
    padding: 7px 0;
    font-size: clamp(16px, 1.7vw, 21px);
}

.stat strong {
    text-align: right;
}

.footer {
    background: var(--green-dark);
    padding: 10px 20px;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
}

.fullscreen-button {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    border: 0;
    border-radius: 10px;
    padding: 11px 16px;
    background: rgba(0, 0, 0, 0.72);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
}

.score-mode .camera-panel {
    display: none;
}

.camera-mode .score-panel {
    display: none;
}

.camera-mode .camera-panel {
    min-height: calc(100vh - 150px);
}

.camera-mode .camera-preview {
    min-height: calc(100vh - 150px);
}


@media (max-width: 1000px) {

    .details-grid {
        grid-template-columns: 1fr;
    }

    .match-line {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">SCOREOS TV</div>

    <div class="header-right">
        <div id="clock" class="clock">--:--:--</div>
        <div class="live">LIVE ●</div>
    </div>
</header>

<nav class="mode-controls">
    <button
        id="scoreModeButton"
        onclick="setMode('score')"
    >
        Scoreboard
    </button>

    <button
        id="cameraModeButton"
        onclick="setMode('camera')"
    >
        Live Camera
    </button>

    <button
        id="splitModeButton"
        onclick="setMode('split')"
    >
        Split Screen
    </button>
</nav>

<main id="screenLayout" class="screen-layout split-mode">

    <section class="camera-panel">
        <img
            id="cameraPreview"
            class="camera-preview"
            src="/api/camera/preview"
            alt="Live cricket camera"
        >

        <div class="camera-badge">
            ● LIVE CAMERA
        </div>

        <div
            id="cameraMessage"
            class="camera-message"
        >
            Camera preview unavailable
        </div>
    </section>

    <section class="score-panel">
        <div class="score-strip">
            <div class="match-line">
                <div class="teams">
                    <span id="batting-team">
                        Batting Team
                    </span>
                    v
                    <span id="fielding-team">
                        Fielding Team
                    </span>
                </div>

                <div>
                    <span
                        id="score"
                        class="score-main"
                    >
                        0/0
                    </span>

                    <span class="overs">
                        (<span id="overs">0</span>)
                    </span>
                </div>
            </div>

            <div class="details-grid">
                <div class="panel">
                    <div class="panel-title">
                        Batters
                    </div>

                    <div class="player-row">
                        <div
                            id="batter-a-name"
                            class="player-name"
                        >
                            Batter A
                        </div>

                        <div
                            id="batter-a-runs"
                            class="player-runs"
                        >
                            0
                        </div>

                        <div
                            id="batter-a-balls"
                            class="player-balls"
                        >
                            (0)
                        </div>
                    </div>

                    <div class="player-row">
                        <div
                            id="batter-b-name"
                            class="player-name"
                        >
                            Batter B
                        </div>

                        <div
                            id="batter-b-runs"
                            class="player-runs"
                        >
                            0
                        </div>

                        <div
                            id="batter-b-balls"
                            class="player-balls"
                        >
                            (0)
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">
                        Bowler
                    </div>

                    <div class="player-row">
                        <div
                            id="bowler-name"
                            class="player-name"
                        >
                            Bowler
                        </div>

                        <div
                            id="bowler-figures"
                            class="player-runs"
                        >
                            0/0
                        </div>

                        <div></div>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">
                        Match
                    </div>

                    <div class="stat">
                        <span>Current over</span>
                        <strong id="current-over">
                            —
                        </strong>
                    </div>

                    <div class="stat">
                        <span>Last wicket</span>
                        <strong id="last-wicket">
                            —
                        </strong>
                    </div>

                    <div class="stat">
                        <span>Runs required</span>
                        <strong id="runs-required">
                            —
                        </strong>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<div class="footer">
    Sutton Cricket Club
</div>

<button
    id="fullscreen-btn"
    class="fullscreen-button"
>
    ⛶ Full Screen
</button>

<script>
function cleanScore(value, fallback = "0") {
    if (value === null || value === undefined) {
        return fallback;
    }

    const text = String(value).trim();

    if (!text || text === "---") {
        return fallback;
    }

    const cleaned = text.replace(/^-+/, "");

    return cleaned || fallback;
}

function updateClock() {
    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("en-GB");
}

function setMode(mode) {
    const allowed = ["score", "camera", "split"];

    if (!allowed.includes(mode)) {
        mode = "split";
    }

    const layout =
        document.getElementById("screenLayout");

    layout.className =
        `screen-layout ${mode}-mode`;

    document
        .getElementById("scoreModeButton")
        .classList.toggle(
            "active",
            mode === "score"
        );

    document
        .getElementById("cameraModeButton")
        .classList.toggle(
            "active",
            mode === "camera"
        );

    document
        .getElementById("splitModeButton")
        .classList.toggle(
            "active",
            mode === "split"
        );

    localStorage.setItem(
        "scoreos-tv-mode",
        mode
    );

    const url =
        new URL(window.location.href);

    url.searchParams.set("mode", mode);

    window.history.replaceState(
        {},
        "",
        url
    );
}

function initialMode() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("mode") ||
        localStorage.getItem("scoreos-tv-mode") ||
        "split"
    );
}

async function updateTV() {
    try {
        const response = await fetch(
            "/api/state",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const state = await response.json();

        const total =
            cleanScore(state.total);

        const wickets =
            cleanScore(state.wickets);

        const overs =
            cleanScore(state.overs);

        document
            .getElementById("score")
            .textContent =
                `${total}/${wickets}`;

        document
            .getElementById("overs")
            .textContent = overs;

        document
            .getElementById("batting-team")
            .textContent =
                state.BatTeamName ||
                "Batting Team";

        document
            .getElementById("fielding-team")
            .textContent =
                state.FieldTeamName ||
                "Fielding Team";

        document
            .getElementById("batter-a-name")
            .textContent =
                (
                    state.BatAStriker === "1"
                        ? "★ "
                        : ""
                ) +
                (
                    state.Bat1Name ||
                    "Batter A"
                );

        document
            .getElementById("batter-a-runs")
            .textContent =
                cleanScore(
                    state.BatAscore
                );

        document
            .getElementById("batter-a-balls")
            .textContent =
                `(${cleanScore(
                    state.BatABallsFaced
                )})`;

        document
            .getElementById("batter-b-name")
            .textContent =
                (
                    state.BatBStriker === "1"
                        ? "★ "
                        : ""
                ) +
                (
                    state.Bat2Name ||
                    "Batter B"
                );

        document
            .getElementById("batter-b-runs")
            .textContent =
                cleanScore(
                    state.BatBscore
                );

        document
            .getElementById("batter-b-balls")
            .textContent =
                `(${cleanScore(
                    state.BatBBallsFaced
                )})`;

        document
            .getElementById("bowler-name")
            .textContent =
                state.Bowler1Name ||
                "Bowler";

        document
            .getElementById("bowler-figures")
            .textContent =
                state.Bowler1Figures ||
                "0/0";

        document
            .getElementById("current-over")
            .textContent =
                state.CurrentOver ||
                "—";

        document
            .getElementById("last-wicket")
            .textContent =
                cleanScore(
                    state.LastWicket,
                    "—"
                );

        document
            .getElementById("runs-required")
            .textContent =
                cleanScore(
                    state.RunsRequired,
                    "—"
                );

    } catch (error) {
        console.error(
            "TV update failed:",
            error
        );
    }
}

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );

cameraPreview.addEventListener(
    "load",
    () => {
        cameraMessage.style.display =
            "none";
    }
);

cameraPreview.addEventListener(
    "error",
    () => {
        cameraMessage.style.display =
            "flex";
    }
);

document
    .getElementById("fullscreen-btn")
    .addEventListener(
        "click",
        async () => {
            if (!document.fullscreenElement) {
                await document
                    .documentElement
                    .requestFullscreen();
            } else {
                await document
                    .exitFullscreen();
            }
        }
    );

setMode(initialMode());

updateClock();
setInterval(updateClock, 1000);

updateTV();
setInterval(updateTV, 1000);
</script>

</body>
</html>
