<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCOREOS TV</title>

<style>
:root{
    --green:#0b5d38;
    --green-dark:#063c25;
    --gold:#f2c94c;
    --panel:#171a19;
    --panel-soft:#222624;
    --muted:#b9c0bc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#090b0a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 28px;
    background:linear-gradient(90deg,var(--green-dark),var(--green));
    border-bottom:4px solid var(--gold);
}

.brand{
    font-size:36px;
    font-weight:900;
    letter-spacing:1px;
}

.live{
    font-size:20px;
    font-weight:800;
}

.camera{
    height:52vh;
    min-height:360px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-size:44px;
    color:#777;
}

.score-strip{
    background:var(--panel);
    padding:22px 28px;
    border-top:1px solid #303531;
}

.match-line{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin-bottom:18px;
}

.teams{
    font-size:26px;
    font-weight:800;
}

.score-main{
    font-size:56px;
    font-weight:900;
    white-space:nowrap;
}

.overs{
    color:var(--muted);
    font-size:26px;
    margin-left:10px;
}

.details-grid{
    display:grid;
    grid-template-columns:2fr 1.2fr 1fr;
    gap:18px;
}

.panel{
    background:var(--panel-soft);
    border-radius:14px;
    padding:16px 18px;
}

.panel-title{
    color:var(--gold);
    font-size:16px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:12px;
}

.player-row{
    display:grid;
    grid-template-columns:1fr auto auto;
    gap:14px;
    align-items:center;
    padding:8px 0;
    border-bottom:1px solid #353a37;
}

.player-row:last-child{
    border-bottom:0;
}

.player-name{
    font-size:24px;
    font-weight:800;
}

.player-runs{
    font-size:28px;
    font-weight:900;
}

.player-balls{
    color:var(--muted);
    font-size:20px;
}

.stat{
    display:flex;
    justify-content:space-between;
    gap:18px;
    padding:7px 0;
    font-size:20px;
}

.stat strong{
    text-align:right;
}

.footer{
    background:var(--green-dark);
    padding:12px 24px;
    text-align:center;
    font-size:22px;
    font-weight:800;
}

@media (max-width:900px){
    .details-grid{
        grid-template-columns:1fr;
    }

    .camera{
        height:42vh;
    }

    .score-main{
        font-size:44px;
    }

    .teams{
        font-size:21px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">SCOREOS TV</div>
    <div class="live">LIVE ●</div>
</header>

<div class="camera">
    🎥 Camera coming soon
</div>

<section class="score-strip">
    <div class="match-line">
        <div class="teams">
            <span id="batting-team">Batting Team</span>
            v
            <span id="fielding-team">Fielding Team</span>
        </div>

        <div>
            <span id="score" class="score-main">0/0</span>
            <span class="overs">(<span id="overs">0</span>)</span>
        </div>
    </div>

    <div class="details-grid">
        <div class="panel">
            <div class="panel-title">Batters</div>

            <div class="player-row">
                <div id="batter-a-name" class="player-name">Batter A</div>
                <div id="batter-a-runs" class="player-runs">0</div>
                <div id="batter-a-balls" class="player-balls">(0)</div>
            </div>

            <div class="player-row">
                <div id="batter-b-name" class="player-name">Batter B</div>
                <div id="batter-b-runs" class="player-runs">0</div>
                <div id="batter-b-balls" class="player-balls">(0)</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Bowler</div>

            <div class="player-row">
                <div id="bowler-name" class="player-name">Bowler</div>
                <div id="bowler-figures" class="player-runs">0/0</div>
                <div></div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">Match</div>

            <div class="stat">
                <span>Current over</span>
                <strong id="current-over">—</strong>
            </div>

            <div class="stat">
                <span>Last wicket</span>
                <strong id="last-wicket">—</strong>
            </div>

            <div class="stat">
                <span>Runs required</span>
                <strong id="runs-required">—</strong>
            </div>
        </div>
    </div>
</section>

<div style="text-align:center; margin:20px 0;">
    <button id="fullscreen-btn"
            style="padding:14px 28px;
                   font-size:20px;
                   font-weight:bold;
                   border:none;
                   border-radius:10px;
                   cursor:pointer;">
        ⛶ Full Screen
    </button>
</div>

<div class="footer">
    Sutton Cricket Club
</div>

<script>
function cleanScore(value, fallback = "0") {
    if (value === null || value === undefined) {
        return fallback;
    }

    const text = String(value).trim();

    if (!text || text === "---") {
        return fallback;
    }

    const cleaned = text.replace(/^-+/, "");

    return cleaned || fallback;
}

async function updateTV() {
    try {
        const response = await fetch("/api/state", {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const state = await response.json();

        const total = cleanScore(state.total);
        const wickets = cleanScore(state.wickets);
        const overs = cleanScore(state.overs);

        document.getElementById("score").textContent =
            `${total}/${wickets}`;

        document.getElementById("overs").textContent = overs;

        document.getElementById("batting-team").textContent =
            state.BatTeamName || "Batting Team";

        document.getElementById("fielding-team").textContent =
            state.FieldTeamName || "Fielding Team";

        document.getElementById("batter-a-name").textContent =
            (state.BatAStriker === "1" ? "★ " : "") +
            (state.Bat1Name || "Batter A");

        document.getElementById("batter-a-runs").textContent =
            cleanScore(state.BatAscore);

        document.getElementById("batter-a-balls").textContent =
            `(${cleanScore(state.BatABallsFaced)})`;

        document.getElementById("batter-b-name").textContent =
            (state.BatBStriker === "1" ? "★ " : "") +
            (state.Bat2Name || "Batter B");

        document.getElementById("batter-b-runs").textContent =
            cleanScore(state.BatBscore);

        document.getElementById("batter-b-balls").textContent =
            `(${cleanScore(state.BatBBallsFaced)})`;

        document.getElementById("bowler-name").textContent =
            state.Bowler1Name || "Bowler";

        document.getElementById("bowler-figures").textContent =
            state.Bowler1Figures || "0/0";

        document.getElementById("current-over").textContent =
            state.CurrentOver || "—";

        document.getElementById("last-wicket").textContent =
            cleanScore(state.LastWicket, "—");

        document.getElementById("runs-required").textContent =
            cleanScore(state.RunsRequired, "—");

    } catch (error) {
        console.error("TV update failed:", error);
    }
}

updateTV();
setInterval(updateTV, 1000);

document.getElementById("fullscreen-btn").addEventListener("click", async () => {
    if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
    } else {
        await document.exitFullscreen();
    }
});
</script>

</body>
</html>
