<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sutton CC Scoreboard</title>
<style>
:root{
  --black:#11161b;
  --panel:#ffffff;
  --line:#c9c9c9;
  --green:#3d9145;
  --green-dark:#32783a;
  --red:#df2720;
  --red-dark:#bd1f19;
  --blue:#155aa8;
  --blue-dark:#104986;
  --yellow:#f2bd18;
  --grey:#8b8b8b;
  --grey-dark:#6f6f6f;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#efefef;color:#111;overflow:hidden}
body{display:flex;flex-direction:column}
header{
  height:54px;
  background:#0e1114;
  color:#fff;
  display:grid;
  grid-template-columns:100px 1fr 170px;
  align-items:center;
  padding:0 18px;
  border-bottom:2px solid #222;
}
.crest{font-weight:700;font-size:13px;letter-spacing:.4px}
.title{text-align:center;font-size:29px;font-weight:700;letter-spacing:1px}
.clock{text-align:right;font-size:16px}
main{
  flex:1;
  padding:8px 10px 6px;
  display:grid;
  grid-template-rows:2.25fr 1.18fr .58fr .52fr .52fr;
  gap:7px;
  min-height:0;
}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}
.panel{
  background:var(--panel);
  border:1px solid #aaa;
  border-radius:5px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.panel-title{
  background:var(--black);
  color:#fff;
  text-align:center;
  font-size:18px;
  font-weight:700;
  padding:5px 4px;
  letter-spacing:.5px;
}
.display{
  background:#030607;
  color:#fff;
  text-align:center;
  font-family:"Courier New",monospace;
  font-size:56px;
  line-height:1;
  padding:7px 4px 4px;
  font-weight:700;
  letter-spacing:4px;
}
.display.small{font-size:43px;padding:5px 4px 3px}
.pad{
  flex:1;
  padding:7px;
  display:grid;
  gap:7px;
  min-height:0;
}
.two-col{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr)}
.total-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.total-grid .zero{grid-column:1/4}
button{
  border:1px solid rgba(0,0,0,.28);
  border-radius:5px;
  color:#fff;
  font-weight:700;
  font-size:24px;
  cursor:pointer;
  touch-action:manipulation;
  min-height:0;
}
button:active{transform:translateY(1px);filter:brightness(.92)}
.green{background:linear-gradient(var(--green),var(--green-dark))}
.red{background:linear-gradient(var(--red),var(--red-dark))}
.blue{background:linear-gradient(#1c66b9,var(--blue-dark))}
.yellow{background:linear-gradient(#ffc91b,#e6ab00);color:#111}
.grey{background:linear-gradient(#aaa,var(--grey-dark))}
.zero{background:linear-gradient(#aaa,#777)}
.compact-controls{
  flex:1;
  display:grid;
  grid-template-columns:1fr 1.15fr 1fr;
  gap:8px;
  padding:8px;
}
.compact-controls button{font-size:23px}

.batter-name-controls{
  display:grid;
  grid-template-columns:1fr 64px;
  gap:5px;
  padding:4px 5px;
}
.batter-name-controls input{
  min-width:0;
  width:100%;
  height:32px;
  padding:3px 7px;
  border:1px solid #999;
  border-radius:5px;
  font-size:15px;
  font-weight:700;
}
.batter-name-controls button{
  min-height:32px;
  font-size:13px;
}
.target-controls{
  padding:6px 8px 7px;
  display:grid;
  grid-template-columns:1fr 145px;
  grid-template-rows:1fr 34px;
  gap:6px;
  flex:1;
}
.target-controls input{
  width:100%;
  font-size:24px;
  font-weight:700;
  padding:4px 10px;
  border:1px solid #999;
  border-radius:5px;
}
.target-controls button{font-size:17px}
.target-controls .clear{grid-column:1/3}
.info-row .panel{justify-content:center}
.info-title{text-align:center;font-size:18px;font-weight:700;padding:5px 4px 0}
.info-value{text-align:center;font-family:"Courier New",monospace;font-size:35px;line-height:1;padding:2px 4px 5px}
.action-row{
  display:grid;
  grid-template-columns:1.25fr repeat(4,1fr);
  gap:9px;
}
.action-row button,.bottom-row button{font-size:17px}
.bottom-row{
  display:grid;
  grid-template-columns:1.05fr 1fr 1fr 1fr 1.05fr;
  gap:9px;
}
footer{
  height:38px;
  background:#121619;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-around;
  font-size:12px;
  padding:0 12px;
}
.status{display:flex;align-items:center;gap:7px}
.dot{width:11px;height:11px;border-radius:50%;background:#39b54a;display:inline-block}
@media (max-height:700px){
  header{height:46px}
  .title{font-size:24px}
  main{padding:5px 7px;gap:5px}
  .grid3{gap:7px}
  .panel-title{font-size:15px;padding:3px}
  .display{font-size:46px;padding:4px 3px 2px}
  .display.small{font-size:36px}
  .pad{padding:5px;gap:5px}
  button{font-size:20px}
  .compact-controls{padding:5px;gap:5px}
  .compact-controls button{font-size:19px}
  .target-controls{padding:4px 5px;gap:4px;grid-template-columns:1fr 120px;grid-template-rows:1fr 28px}
  .target-controls input{font-size:20px}
  .target-controls button{font-size:14px}
  .info-title{font-size:15px;padding-top:3px}
  .info-value{font-size:29px}
  .action-row,.bottom-row{gap:6px}
  .action-row button,.bottom-row button{font-size:14px}
  footer{height:32px;font-size:10px}
}

.input-mode-bar{
  background:#ffffff;
  border-bottom:1px solid #a9a9a9;
  padding:7px 12px;
  display:grid;
  grid-template-columns:150px minmax(360px,520px) 1fr;
  gap:14px;
  align-items:center;
  flex-shrink:0;
}

.input-mode-heading{
  font-size:15px;
  font-weight:700;
  letter-spacing:.6px;
}

.input-mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.input-mode-button{
  border:2px solid #777;
  border-radius:6px;
  background:#dedede;
  color:#222;
  min-height:40px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.input-mode-button.active{
  background:#3d9145;
  border-color:#32783a;
  color:#fff;
}

.input-mode-button.switching{
  opacity:.6;
  cursor:wait;
}

.input-mode-status{
  text-align:right;
  font-size:14px;
  line-height:1.25;
}

.input-mode-status strong{
  display:block;
  font-size:16px;
}

.input-mode-warning{
  color:#bd1f19;
  font-weight:700;
}

main button:disabled,
main input:disabled{
  opacity:.35;
  cursor:not-allowed;
  filter:grayscale(75%);
}

@media (max-width:800px){
  .input-mode-bar{
    grid-template-columns:1fr;
    gap:5px;
  }

  .input-mode-heading,
  .input-mode-status{
    text-align:center;
  }
}


/* ---------------------------------------------------------
   Landscape tablet layout
--------------------------------------------------------- */

@media (orientation: landscape) and (max-height: 850px) {

  body{
    overflow:hidden;
  }

  header{
    height:38px;
    min-height:38px;
  }

  .crest{
    font-size:10px;
    line-height:1.1;
  }

  .title{
    font-size:20px;
  }

  .clock{
    font-size:13px;
  }

  .input-mode-bar{
    padding:3px 8px;
    grid-template-columns:105px 300px 1fr;
    gap:8px;
    min-height:38px;
  }

  .input-mode-heading{
    font-size:12px;
  }

  .input-mode-button{
    min-height:30px;
    font-size:12px;
    padding:2px 5px;
  }

  .input-mode-status{
    font-size:11px;
    line-height:1.05;
  }

  .input-mode-status strong{
    font-size:12px;
  }

  main{
    padding:4px 6px;
    gap:4px;
    overflow:hidden;
  }

  .grid3{
    gap:5px;
  }

  .panel{
    min-height:0;
  }

  .panel-title{
    font-size:13px;
    padding:2px;
  }

  .batter-name-controls{
    padding:2px 3px;
    gap:3px;
    grid-template-columns:1fr 50px;
  }

  .batter-name-controls input{
    height:25px;
    font-size:12px;
    padding:1px 5px;
  }

  .batter-name-controls button{
    min-height:25px;
    font-size:10px;
    padding:1px 3px;
  }

  .display{
    font-size:38px;
    line-height:.95;
    padding:2px;
    min-height:42px;
  }

  .display.small{
    font-size:31px;
    min-height:34px;
  }

  .pad{
    padding:3px;
    gap:3px;
  }

  .two-col{
    grid-template-columns:1fr 1fr;
  }

  button{
    min-height:29px;
    padding:2px 5px;
    font-size:15px;
  }

  .compact-controls{
    padding:3px;
    gap:3px;
  }

  .compact-controls button{
    font-size:14px;
  }

  .target-controls{
    padding:3px;
    gap:3px;
    grid-template-columns:1fr 92px;
    grid-template-rows:30px 25px;
  }

  .target-controls input{
    font-size:16px;
    padding:2px 6px;
  }

  .target-controls button{
    font-size:11px;
  }

  .info-row{
    min-height:40px;
  }

  .info-title{
    font-size:12px;
    padding:2px 2px 0;
  }

  .info-value{
    font-size:24px;
    padding:0 2px 2px;
  }

  .action-row{
    gap:4px;
  }

  .bottom-row{
    gap:4px;
  }

  .action-row button,
  .bottom-row button{
    min-height:32px;
    font-size:12px;
    padding:2px 4px;
  }

  footer{
    height:25px;
    font-size:9px;
    padding:0 6px;
  }

  .dot{
    width:8px;
    height:8px;
  }
}

</style>
</head>
<body>
<header>
  <div class="crest">SUTTON CC<br>EST. 1854</div>
  <div class="title">SUTTON CC SCOREBOARD</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<section class="input-mode-bar" aria-label="Scoreboard input source">
  <div class="input-mode-heading">INPUT SOURCE</div>

  <div class="input-mode-buttons">
    <button
      id="modePlayCricket"
      class="input-mode-button"
      data-mode-control
      onclick="setInputMode('playcricket')"
    >
      PLAY-CRICKET
    </button>

    <button
      id="modeWebBrowser"
      class="input-mode-button"
      data-mode-control
      onclick="setInputMode('manual')"
    >
      WEB BROWSER
    </button>
  </div>

  <div class="input-mode-status">
    <strong id="inputModeName">Checking input source…</strong>
    <span id="inputModeMessage">Please wait</span>
  </div>
</section>

<main>
  <section class="grid3">
    <div class="panel">
      <div class="panel-title">BATSMAN A</div>
      <div class="batter-name-controls">
        <input
          id="batAName"
          type="text"
          maxlength="40"
          placeholder="Batsman A name"
          onkeydown="if(event.key==='Enter'){setBatterName('a')}"
        >
        <button class="blue" onclick="setBatterName('a')">SET</button>
      </div>
      <div class="display" id="batA">000</div>
      <div class="pad two-col">
        <button class="green" onclick="changeBat('a',1)">+1</button>
        <button class="red" onclick="changeBat('a',-1)">-1</button>
        <button class="green" onclick="changeBat('a',4)">+4</button>
        <button class="red" onclick="changeBat('a',-4)">-4</button>
        <button class="green" onclick="changeBat('a',6)">+6</button>
        <button class="red" onclick="changeBat('a',-6)">-6</button>
        <button class="zero" style="grid-column:1/3" onclick="zeroBat('a')">OUT</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">TOTAL SCORE</div>
      <div class="display" id="total">000</div>
      <div class="pad total-grid">
        <button class="green" onclick="change('total',1)">+1</button>
        <button class="green" onclick="change('total',2)">+2</button>
        <button class="green" onclick="change('total',4)">+4</button>
        <button class="red" onclick="change('total',-1)">-1</button>
        <button class="red" onclick="change('total',-2)">-2</button>
        <button class="red" onclick="change('total',-4)">-4</button>
        <button class="zero" onclick="zero('total')">ZERO</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">BATSMAN B</div>
      <div class="batter-name-controls">
        <input
          id="batBName"
          type="text"
          maxlength="40"
          placeholder="Batsman B name"
          onkeydown="if(event.key==='Enter'){setBatterName('b')}"
        >
        <button class="blue" onclick="setBatterName('b')">SET</button>
      </div>
      <div class="display" id="batB">000</div>
      <div class="pad two-col">
        <button class="green" onclick="changeBat('b',1)">+1</button>
        <button class="red" onclick="changeBat('b',-1)">-1</button>
        <button class="green" onclick="changeBat('b',4)">+4</button>
        <button class="red" onclick="changeBat('b',-4)">-4</button>
        <button class="green" onclick="changeBat('b',6)">+6</button>
        <button class="red" onclick="changeBat('b',-6)">-6</button>
        <button class="zero" style="grid-column:1/3" onclick="zeroBat('b')">OUT</button>
      </div>
    </div>
  </section>

  <section class="grid3">
    <div class="panel">
      <div class="panel-title">WICKETS</div>
      <div class="display small" id="wickets">0</div>
      <div class="compact-controls">
        <button class="green" onclick="change('wickets',1)">+1</button>
        <button class="grey" onclick="zero('wickets')">ZERO</button>
        <button class="red" onclick="change('wickets',-1)">-1</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">OVERS</div>
      <div class="display small" id="overs">00</div>
      <div class="compact-controls">
        <button class="green" onclick="change('overs',1)">+1</button>
        <button class="grey" onclick="newOver()">NEW OVER</button>
        <button class="red" onclick="change('overs',-1)">-1</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">TARGET</div>
      <div class="display small" id="target">---</div>
      <div class="target-controls">
        <input id="targetInput" type="number" min="0" max="999" placeholder="Target">
        <button class="blue" onclick="setTarget()">SET TARGET</button>
        <button class="grey clear" onclick="clearTarget()">CLEAR TARGET (---)</button>
      </div>
    </div>
  </section>

  <section class="grid3 info-row">
    <div class="panel"><div class="info-title">PARTNERSHIP</div><div class="info-value" id="partnership">000</div></div>
    <div class="panel"><div class="info-title">LAST MAN</div><div class="info-value" id="lastMan">000</div></div>
    <div class="panel"><div class="info-title">RUNS REQUIRED</div><div class="info-value" id="required">---</div></div>
  </section>

  <section class="action-row">
    <button class="yellow" onclick="undo()">↻ UNDO LAST ACTION</button>
    <button class="blue" onclick="extra(1)">+ WIDE</button>
    <button class="blue" onclick="extra(1)">+ NO BALL</button>
    <button class="blue" onclick="extra(1)">+ BYE</button>
    <button class="blue" onclick="extra(1)">+ LEG BYE</button>
  </section>

  <section class="bottom-row">
    <button class="blue" onclick="resend()">↻ RESEND SCOREBOARD</button>
    <button class="blue" onclick="testBoard()">▣ TEST BOARD</button>
    <button class="blue" onclick="newOver()">● NEW OVER</button>
    <button class="blue" onclick="window.location.href='/control-classic'">CLASSIC CONTROL</button>
    <button class="red" onclick="resetMatch()">▱ RESET MATCH</button>
  </section>
</main>

<footer>
  <div class="status">ARDUINO <span class="dot"></span> CONNECTED</div>
  <div class="status">BLUETOOTH <span class="dot"></span> CONNECTED</div>
  <div class="status">INPUT <span class="dot"></span> <span id="inputFooter">CHECKING</span></div>
  <div class="status">AUTO SAVE <span class="dot"></span> ON</div>
  <div>SCOREOS v2.0</div>
</footer>

<script>
const API_STATE = "/api/state";
const API_CONTROL = "/api/control";

let liveState = {};
let commandQueue = Promise.resolve();
let refreshRunning = false;
let apiConnected = false;
let currentInputMode = "playcricket";
let modeSwitchRunning = false;


/* ---------------------------------------------------------
   SCOREOS value helpers
--------------------------------------------------------- */

function toNumber(value) {
  if (value === null || value === undefined) return 0;

  const match = String(value).match(/\d+/);
  return match ? Number(match[0]) : 0;
}

function hasNumber(value) {
  return /\d/.test(String(value ?? ""));
}

function pad(value, length = 3) {
  return String(Math.max(0, toNumber(value))).padStart(length, "0");
}

function displayTarget(value) {
  return hasNumber(value) ? pad(value, 3) : "---";
}


/* ---------------------------------------------------------
   Screen rendering
--------------------------------------------------------- */

function render(state) {
  liveState = state || {};

  document.getElementById("batA").textContent =
    pad(liveState.BatAscore, 3);

  document.getElementById("batB").textContent =
    pad(liveState.BatBscore, 3);

  const batANameInput =
    document.getElementById("batAName");

  const batBNameInput =
    document.getElementById("batBName");

  if (document.activeElement !== batANameInput) {
    batANameInput.value =
      liveState.Bat1Name === "-"
        ? ""
        : (liveState.Bat1Name || "");
  }

  if (document.activeElement !== batBNameInput) {
    batBNameInput.value =
      liveState.Bat2Name === "-"
        ? ""
        : (liveState.Bat2Name || "");
  }

  document.getElementById("total").textContent =
    pad(liveState.total, 3);

  document.getElementById("wickets").textContent =
    String(toNumber(liveState.wickets));

  document.getElementById("overs").textContent =
    pad(liveState.overs, 2);

  document.getElementById("target").textContent =
    displayTarget(liveState.target);

  document.getElementById("partnership").textContent =
    pad(liveState.PshipTOT, 3);

  document.getElementById("lastMan").textContent =
    displayTarget(liveState.LastMan);

  document.getElementById("required").textContent =
    displayTarget(liveState.RunsRequired);

  updateInputMode(
    liveState.mode || currentInputMode
  );

  updateConnectionDisplay(true);
}



/* ---------------------------------------------------------
   Input source
--------------------------------------------------------- */

function updateInputMode(mode) {
  currentInputMode =
    mode === "manual" ? "manual" : "playcricket";

  const playButton =
    document.getElementById("modePlayCricket");

  const webButton =
    document.getElementById("modeWebBrowser");

  const modeName =
    document.getElementById("inputModeName");

  const modeMessage =
    document.getElementById("inputModeMessage");

  const footer =
    document.getElementById("inputFooter");

  const webMode = currentInputMode === "manual";

  playButton.classList.toggle("active", !webMode);
  webButton.classList.toggle("active", webMode);

  playButton.disabled = modeSwitchRunning;
  webButton.disabled = modeSwitchRunning;

  playButton.classList.toggle(
    "switching",
    modeSwitchRunning
  );

  webButton.classList.toggle(
    "switching",
    modeSwitchRunning
  );

  if (webMode) {
    modeName.textContent = "Web Browser Control";
    modeMessage.textContent =
      "Play-Cricket packets are being ignored";
    modeMessage.className = "input-mode-warning";

    if (footer) {
      footer.textContent = "WEB BROWSER";
    }

  } else {
    modeName.textContent = "Play-Cricket Bluetooth";
    modeMessage.textContent =
      "Web scoring controls are locked";
    modeMessage.className = "";

    if (footer) {
      footer.textContent = "PLAY-CRICKET";
    }
  }

  setWebControlsEnabled(webMode);
}


function setWebControlsEnabled(enabled) {
  const controls = document.querySelectorAll(
    'main button:not([onclick="resend()"]), ' +
    'main input'
  );

  controls.forEach(controlElement => {
    controlElement.disabled = !enabled;
  });

  const refreshButton = document.querySelector(
    'main button[onclick="resend()"]'
  );

  if (refreshButton) {
    refreshButton.disabled = false;
  }
}


async function setInputMode(mode) {
  if (modeSwitchRunning) return;

  if (!["playcricket", "manual"].includes(mode)) {
    return;
  }

  if (mode === currentInputMode) {
    updateInputMode(mode);
    return;
  }

  const description =
    mode === "manual"
      ? "Web Browser Control"
      : "Play-Cricket Bluetooth";

  if (!confirm(
    "Switch the scoreboard input to " +
    description +
    "?"
  )) {
    return;
  }

  modeSwitchRunning = true;
  updateInputMode(currentInputMode);

  try {
    const result = await sendControl(
      "set_mode",
      mode
    );

    currentInputMode =
      result.mode ||
      mode;

    updateInputMode(currentInputMode);
    await fetchState();

  } catch (error) {
    console.error(
      "Input mode change failed:",
      error
    );

    alert(
      "Could not change the input source.\n\n" +
      error.message
    );

    await fetchState();

  } finally {
    modeSwitchRunning = false;
    updateInputMode(currentInputMode);
  }
}


/* ---------------------------------------------------------
   API communication
--------------------------------------------------------- */

async function fetchState() {
  if (refreshRunning) return;

  refreshRunning = true;

  try {
    const response = await fetch(API_STATE, {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("State request failed: " + response.status);
    }

    const state = await response.json();
    render(state);

  } catch (error) {
    console.error("SCOREOS state error:", error);
    updateConnectionDisplay(false);

  } finally {
    refreshRunning = false;
  }
}

async function sendControl(action, value = 0) {
  const response = await fetch(API_CONTROL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      action: action,
      value: value
    })
  });

  let result;

  try {
    result = await response.json();
  } catch {
    result = {
      ok: false,
      error: "Invalid response from SCOREOS"
    };
  }

  if (!response.ok || !result.ok) {
    throw new Error(
      result.error ||
      "Control request failed: " + response.status
    );
  }

  if (result.state) {
    render(result.state);
  } else {
    await fetchState();
  }

  return result;
}

function control(action, value = 0) {
  commandQueue = commandQueue
    .then(() => sendControl(action, value))
    .catch(error => {
      console.error("SCOREOS control error:", error);
      updateConnectionDisplay(false);
      alert("Scoreboard command failed:\n\n" + error.message);
    });

  return commandQueue;
}


/* ---------------------------------------------------------
   Existing button handlers
--------------------------------------------------------- */

function change(field, amount) {
  const actionMap = {
    total: "score",
    wickets: "wickets",
    overs: "overs",
    target: "target"
  };

  const action = actionMap[field];

  if (!action) {
    console.error("Unknown control field:", field);
    return;
  }

  control(action, amount);
}

function changeBat(which, amount) {
  control(which === "a" ? "bat_a" : "bat_b", amount);
}

function setBatterName(which) {
  const input = document.getElementById(
    which === "a" ? "batAName" : "batBName"
  );

  const name = input.value.trim();

  control(
    which === "a"
      ? "set_bat_a_name"
      : "set_bat_b_name",
    name
  );

  input.blur();
}

async function zeroBat(which) {
  const currentName =
    which === "a"
      ? (liveState.Bat1Name || "Batsman A")
      : (liveState.Bat2Name || "Batsman B");

  if (!confirm("Record " + currentName + " as out?")) {
    return;
  }

  await control("batter_wicket", which);

  const newName = prompt(
    "Enter the new batter name:",
    ""
  );

  if (newName === null) {
    return;
  }

  const cleanName = newName.trim();

  if (!cleanName) {
    return;
  }

  await control(
    which === "a"
      ? "set_bat_a_name"
      : "set_bat_b_name",
    cleanName
  );
}

function zero(field) {
  let current = 0;
  let action = "";

  if (field === "total") {
    current = toNumber(liveState.total);
    action = "score";

  } else if (field === "wickets") {
    current = toNumber(liveState.wickets);
    action = "wickets";

  } else if (field === "overs") {
    current = toNumber(liveState.overs);
    action = "overs";

  } else {
    return;
  }

  if (current === 0) return;

  if (!confirm("Set " + field + " to zero?")) {
    return;
  }

  control(action, -current);
}

function setTarget() {
  const input = document.getElementById("targetInput");
  const value = Number(input.value);

  if (!Number.isInteger(value) || value < 0 || value > 999) {
    alert("Enter a target between 0 and 999.");
    return;
  }

  control("set_target", value);
  input.value = "";
}

function clearTarget() {
  alert(
    "Clear Target is not supported by the SCOREOS engine yet.\n\n" +
    "We will add a proper clear_target action next."
  );
}

function newOver() {
  control("overs", 1);
}

function extra(runs) {
  control("score", runs);
}

function resetMatch() {
  if (!confirm(
    "Reset the whole match?\n\n" +
    "This will clear all scores, wickets, overs and the target."
  )) {
    return;
  }

  control("reset", 0);
}

function undo() {
  control("undo", 0);
}

function resend() {
  fetchState();
}

function testBoard() {
  alert(
    "Test Board is not supported by the SCOREOS engine yet.\n\n" +
    "We will add a proper test_board action."
  );
}


/* ---------------------------------------------------------
   Connection display
--------------------------------------------------------- */

function updateConnectionDisplay(connected) {
  apiConnected = connected;

  const dots = document.querySelectorAll(".dot");

  dots.forEach(dot => {
    dot.style.background = connected ? "#39b54a" : "#df2720";
  });
}


/* ---------------------------------------------------------
   Initialise
--------------------------------------------------------- */

document.getElementById("targetInput").addEventListener(
  "keydown",
  event => {
    if (event.key === "Enter") {
      setTarget();
    }
  }
);

document.querySelector(
  'button[onclick="undo()"]'
).textContent = "↻ UNDO LAST ACTION";

document.querySelector(
  'button[onclick="resend()"]'
).textContent = "↻ REFRESH DISPLAY";

document.querySelector(
  'button[onclick="testBoard()"]'
).textContent = "▣ TEST BOARD — COMING SOON";

setInterval(() => {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();
}, 1000);

fetchState();
setInterval(fetchState, 1000);
</script>
