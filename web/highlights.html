<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREOS Highlights</title>

<style>
:root {
    --bg: #0b1220;
    --panel: #111827;
    --panel2: #172033;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #facc15;
    --green: #22c55e;
    --border: #243244;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 18px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1300px;
    margin: auto;
}

.brand {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
}

.brand span {
    color: var(--accent);
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
}

nav {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-top: 16px;
}

nav a {
    color: var(--text);
    text-decoration: none;
    background: var(--panel2);
    padding: 10px 14px;
    border-radius: 9px;
    white-space: nowrap;
}

nav a.active {
    background: var(--accent);
    color: #111;
    font-weight: 800;
}

main {
    max-width: 1300px;
    margin: auto;
    padding: 22px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.summary {
    font-size: 18px;
    font-weight: 700;
}

.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
}

.filter.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: 800;
}

.match-section {
    margin-bottom: 34px;
    padding: 20px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.match-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.rename-match-button {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    background: var(--panel);
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
}

.rename-match-button:hover {
    border-color: var(--accent);
}

.match-section-title {
    font-size: 26px;
    font-weight: 900;
}

.match-section-subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.recording-panel {
    display: grid;
    grid-template-columns:
        minmax(220px, 1fr)
        minmax(420px, 1.6fr)
        auto;
    align-items: center;
    gap: 22px;
    padding: 22px 26px;
    margin-bottom: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.recording-info {
    min-width: 0;
}

.recording-title {
    font-size: 24px;
    font-weight: 900;
}

.recording-status {
    margin-top: 7px;
    color: var(--muted);
}

.recording-status.live {
    color: #f87171;
    font-weight: 900;
}

.recording-match-name {
    margin-top: 7px;
    font-size: 18px;
    font-weight: 800;
}

.match-setup {
    display: grid;
    grid-template-columns:
        minmax(160px, 1fr)
        auto
        minmax(160px, 1fr);
    gap: 10px;
    align-items: end;
}

.team-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.team-field label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

.team-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #111;
    font: inherit;
}

.match-v {
    padding-bottom: 11px;
    font-weight: 900;
}

.recording-button {
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    min-width: 230px;
    white-space: nowrap;
}

.recording-button.start {
    background: #ef4444;
    color: white;
}

.recording-button.stop {
    background: #facc15;
    color: #111;
}

.recording-button:disabled {
    opacity: 0.55;
    cursor: wait;
}

@media (max-width: 1050px) {
    .recording-panel {
        grid-template-columns: 1fr;
    }

    .recording-button {
        width: 100%;
    }
}

@media (max-width: 650px) {
    .match-setup {
        grid-template-columns: 1fr;
    }

    .match-v {
        text-align: center;
        padding: 0;
    }
}

.match-feature {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
}

.match-feature-header {
    padding: 16px 18px;
    background: var(--panel2);
}

.match-feature-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--accent);
}

.match-feature-subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.match-feature video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 70vh;
}

.match-feature-actions {
    display: flex;
    gap: 10px;
    padding: 15px;
}

.match-feature-actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    border-radius: 9px;
    font-weight: 800;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
}

.video-wrap {
    background: #000;
    aspect-ratio: 16 / 9;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.card-body {
    padding: 15px;
}

.event-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.event {
    font-size: 22px;
    font-weight: 900;
}

.event.FOUR {
    color: #38bdf8;
}

.event.SIX {
    color: var(--accent);
}

.event.WICKET {
    color: #f87171;
}

.time {
    color: var(--muted);
    font-size: 14px;
}

.description {
    margin-top: 7px;
    font-size: 16px;
    font-weight: 600;
}

.filename {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    word-break: break-all;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 9px;
    font-weight: 800;
}

.play {
    background: var(--green);
    color: #07130a;
}

.download {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

.empty {
    padding: 50px 20px;
    text-align: center;
    background: var(--panel);
    border-radius: 14px;
    color: var(--muted);
}

@media (max-width: 600px) {
    main {
        padding: 14px;
    }

    header {
        padding: 16px;
    }

    .brand {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            SCOREOS <span>HIGHLIGHTS</span>
        </div>

        <div class="subtitle">
            Automatic match clips from FOURs, SIXes and WICKETs
        </div>

        <nav>
            <a href="/dashboard">Dashboard</a>
            <a href="/groundcontrol">Ground Control</a>
            <a href="/control">Control</a>
            <a href="/tv">TV Display</a>
            <a class="active" href="/highlights">Highlights</a>
        </nav>
    </div>
</header>

<main>

    <div class="toolbar">
        <div
            class="summary"
            id="summary"
        >
            Loading highlights…
        </div>

        <div class="filters">
            <button
                class="filter active"
                data-filter="ALL"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="FOUR"
            >
                Fours
            </button>

            <button
                class="filter"
                data-filter="SIX"
            >
                Sixes
            </button>

            <button
                class="filter"
                data-filter="WICKET"
            >
                Wickets
            </button>
        </div>
    </div>

    <section class="recording-panel">
    <div class="recording-info">
        <div class="recording-title">
            Full Match Recording
        </div>

        <div
            id="recording-status"
            class="recording-status"
        >
            Checking recording status…
        </div>

        <div
            id="recording-match-name"
            class="recording-match-name"
        ></div>
    </div>

    <div
        id="match-setup"
        class="match-setup"
    >
        <div class="team-field">
            <label for="home-team">
                Home Team
            </label>

            <input
                id="home-team"
                type="text"
                placeholder="Home team"
                value="Sutton CC"
            >
        </div>

        <div class="match-v">
            v
        </div>

        <div class="team-field">
            <label for="away-team">
                Away Team
            </label>

            <input
                id="away-team"
                type="text"
                placeholder="Away team"
            >
        </div>
    </div>

    <button
        id="recording-button"
        class="recording-button start"
        type="button"
        onclick="toggleMatchRecording()"
    >
        🔴 START MATCH RECORDING
    </button>
</section>

<div id="full-match"></div>

<div id="match-highlight"></div>

    <div id="content"></div>

</main>

<script>
let matches = [];
let unassigned = [];
let currentFilter = "ALL";
let matchRecording = false;

function prettyName(item) {
    const stem = item.filename
        .replace(/\.mp4$/i, "");

    const parts = stem.split("_");

    if (parts.length < 5) {
        return item.filename;
    }

    const person = parts
        .slice(3, -1)
        .join(" ")
        .replaceAll("-", " ")
        .replace(
            /\b\w/g,
            character => character.toUpperCase()
        );

    const score = parts[parts.length - 1];

    if (item.event_type === "WICKET") {
        return person === "Unknown Batter"
            ? "Wicket"
            : person + " — Wicket";
    }

    return person + " — " + score;
}

function prettyTime(item) {
    const date = new Date(
        item.modified * 1000
    );

    return date.toLocaleString(
        undefined,
        {
            dateStyle: "medium",
            timeStyle: "short",
        }
    );
}

function renderFullMatch() {
    const container = document.getElementById(
        "full-match"
    );

    if (!fullMatch) {
        container.innerHTML = "";
        return;
    }

    container.innerHTML = `
        <section class="match-feature">

            <div class="match-feature-header">
                <div class="match-feature-title">
                    🎥 FULL MATCH
                </div>

                <div class="match-feature-subtitle">
                    Complete match recording
                    — ${fullMatch.session_id}
                </div>
            </div>

            <video
                controls
                preload="metadata"
                src="${fullMatch.video_url}"
            ></video>

            <div class="match-feature-actions">

                <a
                    class="play"
                    href="${fullMatch.video_url}"
                    target="_blank"
                >
                    Play Full Match
                </a>

                <a
                    class="download"
                    href="${fullMatch.download_url}"
                >
                    Download Full Match
                </a>

            </div>

        </section>
    `;
}


function renderClipCard(item) {
    return `
        <article class="card">

            <div class="video-wrap">
                <video
                    controls
                    preload="metadata"
                    src="${item.video_url}"
                ></video>
            </div>

            <div class="card-body">

                <div class="event-row">
                    <div
                        class="event ${item.event_type}"
                    >
                        ${item.event_type}
                    </div>

                    <div class="time">
                        ${prettyTime(item)}
                    </div>
                </div>

                <div class="description">
                    ${prettyName(item)}
                </div>

                <div class="filename">
                    ${item.filename}
                </div>

                <div class="actions">
                    <a
                        class="play"
                        href="${item.video_url}"
                        target="_blank"
                    >
                        Play
                    </a>

                    <a
                        class="download"
                        href="${item.download_url}"
                    >
                        Download
                    </a>
                </div>

            </div>

        </article>
    `;
}


function renderFeature(item, title, subtitle, playText) {
    if (!item) {
        return "";
    }

    return `
        <section class="match-feature">

            <div class="match-feature-header">
                <div class="match-feature-title">
                    ${title}
                </div>

                <div class="match-feature-subtitle">
                    ${subtitle}
                </div>
            </div>

            <video
                controls
                preload="metadata"
                src="${item.video_url}"
            ></video>

            <div class="match-feature-actions">

                <a
                    class="play"
                    href="${item.video_url}"
                    target="_blank"
                >
                    ${playText}
                </a>

                <a
                    class="download"
                    href="${item.download_url}"
                >
                    Download
                </a>

            </div>

        </section>
    `;
}


function matchTitle(match) {
    const fixture =
        match.match_name
        || match.session_id;

    if (!match.date) {
        return fixture;
    }

    const date = new Date(
        match.date + "T12:00:00"
    );

    if (Number.isNaN(date.getTime())) {
        return fixture;
    }

    return (
        fixture
        + " — "
        + date.toLocaleDateString(
            undefined,
            {
                dateStyle: "medium",
            }
        )
    );
}


function render() {
    const content = document.getElementById(
        "content"
    );

    const matchSections = matches.map(match => {
        const filtered = (
            match.highlights || []
        ).filter(
            item =>
                currentFilter === "ALL"
                || item.event_type === currentFilter
        );

        const features = (
            currentFilter === "ALL"
            ? (
                renderFeature(
                    match.full_match,
                    "🎥 FULL MATCH",
                    "Complete match recording",
                    "Play Full Match"
                )
                +
                renderFeature(
                    match.match_highlights,
                    "🎬 MATCH HIGHLIGHTS",
                    "FOURs, SIXes, wickets, 50s and 100s",
                    "Play Match Highlights"
                )
            )
            : ""
        );

        if (
            !features
            && !filtered.length
        ) {
            return "";
        }

        return `
            <section class="match-section">

                <div class="match-section-header">
                    <div>
                        <div class="match-section-title">
                            ${matchTitle(match)}
                        </div>

                        <div class="match-section-subtitle">
                            ${filtered.length}
                            ${
                                filtered.length === 1
                                ? " highlight"
                                : " highlights"
                            }
                        </div>
                    </div>

                    <button
                        class="rename-match-button"
                        type="button"
                        onclick="renameMatch('${match.session_id}')"
                    >
                        ✏️ Rename Match
                    </button>
                </div>

                ${features}

                ${
                    filtered.length
                    ? `
                        <div class="grid">
                            ${filtered.map(
                                renderClipCard
                            ).join("")}
                        </div>
                    `
                    : ""
                }

            </section>
        `;
    }).join("");

    const filteredUnassigned =
        unassigned.filter(
            item =>
                currentFilter === "ALL"
                || item.event_type === currentFilter
        );

    const unassignedSection =
        filteredUnassigned.length
        ? `
            <section class="match-section">

                <div class="match-section-header">
                    <div>
                        <div class="match-section-title">
                            Earlier / Unassigned Clips
                        </div>

                        <div class="match-section-subtitle">
                            Clips created before match sessions
                            were introduced
                        </div>
                    </div>
                </div>

                <div class="grid">
                    ${filteredUnassigned.map(
                        renderClipCard
                    ).join("")}
                </div>

            </section>
        `
        : "";

    const total =
        matches.reduce(
            (count, match) =>
                count
                + (match.highlights || []).filter(
                    item =>
                        currentFilter === "ALL"
                        || item.event_type === currentFilter
                ).length,
            0
        )
        + filteredUnassigned.length;

    document.getElementById(
        "summary"
    ).textContent =
        matches.length
        + (
            matches.length === 1
            ? " match"
            : " matches"
        )
        + " • "
        + total
        + (
            total === 1
            ? " highlight"
            : " highlights"
        );

    content.innerHTML =
        matchSections
        + unassignedSection;

    if (!content.innerHTML.trim()) {
        content.innerHTML = `
            <div class="empty">
                No highlights found.
            </div>
        `;
    }
}


function formatRecordingStart(session) {
    if (!session || !session.started_iso) {
        return "";
    }

    const date = new Date(session.started_iso);

    if (Number.isNaN(date.getTime())) {
        return session.started_iso;
    }

    return date.toLocaleTimeString(
        undefined,
        {
            hour: "2-digit",
            minute: "2-digit",
        }
    );
}


async function loadMatchRecordingStatus() {
    const status = document.getElementById(
        "recording-status"
    );

    const button = document.getElementById(
        "recording-button"
    );

    try {
        const response = await fetch(
            "/api/match/status",
            {
                cache: "no-store",
            }
        );

        const data = await response.json();

        matchRecording = Boolean(
            data.recording
        );

        if (matchRecording) {
            const started =
                formatRecordingStart(
                    data.session
                );

            status.textContent =
                "● RECORDING"
                + (
                    started
                    ? " — started " + started
                    : ""
                );

            status.classList.add("live");

            const setup = document.getElementById(
                "match-setup"
            );

            const matchName = document.getElementById(
                "recording-match-name"
            );

            if (setup) {
                setup.style.display = "none";
            }

            if (matchName) {
                matchName.textContent =
                    data.session?.match_name || "";
            }

            button.textContent =
                "⏹ STOP MATCH RECORDING";

            button.classList.remove("start");
            button.classList.add("stop");

        } else {
            status.textContent =
                "Not currently recording";

            status.classList.remove("live");

            const setup = document.getElementById(
                "match-setup"
            );

            const matchName = document.getElementById(
                "recording-match-name"
            );

            if (setup) {
                setup.style.display = "";
            }

            if (matchName) {
                matchName.textContent = "";
            }

            button.textContent =
                "🔴 START MATCH RECORDING";

            button.classList.remove("stop");
            button.classList.add("start");
        }

    } catch (error) {
        console.error(error);

        status.textContent =
            "Recording status unavailable";
    }
}


async function toggleMatchRecording() {
    const button = document.getElementById(
        "recording-button"
    );

    button.disabled = true;

    const endpoint = matchRecording
        ? "/api/match/stop"
        : "/api/match/start";

    const homeTeam = document.getElementById(
        "home-team"
    ).value.trim();

    const awayTeam = document.getElementById(
        "away-team"
    ).value.trim();

    if (
        !matchRecording
        && (!homeTeam || !awayTeam)
    ) {
        alert(
            "Please enter both teams before starting the match."
        );

        button.disabled = false;
        return;
    }

    const requestBody = matchRecording
        ? {}
        : {
            home_team: homeTeam,
            away_team: awayTeam,
        };

    try {
        const response = await fetch(
            endpoint,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify(
                    requestBody
                ),
                cache: "no-store",
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                data.error
                || "Recording action failed"
            );
        }

        await loadMatchRecordingStatus();

    } catch (error) {
        console.error(error);

        alert(
            "Match recording failed: "
            + error.message
        );

    } finally {
        button.disabled = false;
    }
}


async function renameMatch(sessionId) {
    const match = matches.find(
        item => item.session_id === sessionId
    );

    if (!match) {
        alert("Match not found.");
        return;
    }

    const homeTeam = prompt(
        "Home team:",
        match.home_team || ""
    );

    if (homeTeam === null) {
        return;
    }

    const awayTeam = prompt(
        "Away team:",
        match.away_team || ""
    );

    if (awayTeam === null) {
        return;
    }

    if (!homeTeam.trim() || !awayTeam.trim()) {
        alert("Both team names are required.");
        return;
    }

    try {
        const response = await fetch(
            "/api/match/rename",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify(
                    {
                        session_id: sessionId,
                        home_team: homeTeam.trim(),
                        away_team: awayTeam.trim(),
                    }
                ),
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                data.error || "Rename failed"
            );
        }

        await loadHighlights();

    } catch (error) {
        alert(
            "Unable to rename match: "
            + error.message
        );
    }
}


async function loadHighlights() {
    try {
        const response = await fetch(
            "/api/highlights",
            {
                cache: "no-store",
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                "Highlights API returned an error"
            );
        }

        matches = data.matches || [];
        unassigned = data.unassigned || [];

        render();

    } catch (error) {
        console.error(error);

        document.getElementById(
            "summary"
        ).textContent =
            "Highlights unavailable";

        document.getElementById(
            "content"
        ).innerHTML = `
            <div class="empty">
                Unable to load highlights.
            </div>
        `;
    }
}

document
    .querySelectorAll(".filter")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => {
                document
                    .querySelectorAll(".filter")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                currentFilter =
                    button.dataset.filter;

                render();
            }
        );
    });

loadHighlights();
loadMatchRecordingStatus();

setInterval(
    loadHighlights,
    10000
);

setInterval(
    loadMatchRecordingStatus,
    5000
);
</script>

</body>
</html>
