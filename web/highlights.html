<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCOREOS Highlights</title>

<style>
:root {
    --bg: #0b1220;
    --panel: #111827;
    --panel2: #172033;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #facc15;
    --green: #22c55e;
    --border: #243244;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 18px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
}

.header-inner {
    max-width: 1300px;
    margin: auto;
}

.brand {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 1px;
}

.brand span {
    color: var(--accent);
}

.subtitle {
    margin-top: 4px;
    color: var(--muted);
}

nav {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    margin-top: 16px;
}

nav a {
    color: var(--text);
    text-decoration: none;
    background: var(--panel2);
    padding: 10px 14px;
    border-radius: 9px;
    white-space: nowrap;
}

nav a.active {
    background: var(--accent);
    color: #111;
    font-weight: 800;
}

main {
    max-width: 1300px;
    margin: auto;
    padding: 22px;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.summary {
    font-size: 18px;
    font-weight: 700;
}

.filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.filter {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 20px;
    cursor: pointer;
}

.filter.active {
    background: var(--accent);
    color: #111;
    border-color: var(--accent);
    font-weight: 800;
}

/* Match library */

.match-library {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
}

.match-library-card {
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel);
    cursor: pointer;
    transition:
        transform 0.15s ease,
        border-color 0.15s ease;
}

.match-library-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
}

.match-library-title {
    font-size: 21px;
    font-weight: 900;
}

.match-library-date {
    margin-top: 6px;
    color: var(--muted);
}

.match-library-storage {
    margin-top: 12px;
    font-size: 14px;
    color: var(--muted);
}

.match-library-open {
    margin-top: 16px;
    color: var(--accent);
    font-weight: 900;
}

.match-browser-back {
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 14px;
    margin-bottom: 18px;
    background: var(--panel);
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
}

.match-choice-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-top: 20px;
}

.match-choice {
    min-height: 120px;
    padding: 20px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--panel2);
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.match-choice:hover {
    border-color: var(--accent);
}

.match-choice-icon {
    font-size: 28px;
    margin-bottom: 9px;
}

.match-choice-title {
    font-size: 18px;
    font-weight: 900;
}

.match-choice-detail {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
}

.match-section {
    margin-bottom: 34px;
    padding: 20px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.match-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
}

.match-manage-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.export-usb-button {
    border: 1px solid #22c55e;
    border-radius: 8px;
    padding: 9px 12px;
    background: #166534;
    color: white;
    font-weight: 800;
    cursor: pointer;
}

.export-usb-button:hover {
    background: #15803d;
}

.export-usb-button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.delete-match-button {
    border: 1px solid #ef4444;
    border-radius: 8px;
    padding: 9px 12px;
    background: transparent;
    color: #f87171;
    font-weight: 800;
    cursor: pointer;
}

.delete-match-button:hover {
    background: #ef4444;
    color: white;
}

.rename-match-button {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    background: var(--panel);
    color: var(--text);
    font-weight: 800;
    cursor: pointer;
}

.rename-match-button:hover {
    border-color: var(--accent);
}

.match-section-title {
    font-size: 26px;
    font-weight: 900;
}

.match-storage {
    margin-top: 7px;
    color: var(--muted);
    font-size: 14px;
}

.match-storage strong {
    color: var(--text);
}

.match-section-subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.camera-status-panel {
    margin-bottom: 12px;
    padding: 12px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-weight: 800;
}

.camera-status-panel.ready {
    border-color: #4ade80;
    color: #4ade80;
}

.camera-status-panel.recording {
    border-color: #f87171;
    color: #f87171;
}

.camera-status-panel.offline {
    border-color: #facc15;
    color: #facc15;
}

.camera-status-panel.reconnecting {
    border-color: #fb923c;
    color: #fb923c;
}

.storage-panel {
    margin-bottom: 18px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-weight: 700;
}

.storage-panel.warning {
    border-color: #facc15;
    color: #facc15;
}

.storage-panel.critical {
    border-color: #f87171;
    color: #f87171;
}

.storage-panel .storage-detail {
    margin-top: 5px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
}

.recording-panel {
    display: grid;
    grid-template-columns:
        minmax(220px, 1fr)
        minmax(420px, 1.6fr)
        auto;
    align-items: center;
    gap: 22px;
    padding: 22px 26px;
    margin-bottom: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
}

.recording-info {
    min-width: 0;
}

.recording-title {
    font-size: 24px;
    font-weight: 900;
}

.recording-status {
    margin-top: 7px;
    color: var(--muted);
}

.recording-status.live {
    color: #f87171;
    font-weight: 900;
}

.recording-status.finished {
    color: #facc15;
    font-weight: 900;
    font-size: 18px;
}

.recording-button.finished {
    background: #facc15;
    color: #111;
}

.recording-match-name {
    margin-top: 7px;
    font-size: 18px;
    font-weight: 800;
}

.match-setup {
    display: grid;
    grid-template-columns:
        minmax(160px, 1fr)
        auto
        minmax(160px, 1fr);
    gap: 10px;
    align-items: end;
}

.team-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.team-field label {
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

.team-field input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: #111;
    font: inherit;
}

.match-v {
    padding-bottom: 11px;
    font-weight: 900;
}

.recording-button {
    border: 0;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 900;
    cursor: pointer;
    min-width: 230px;
    white-space: nowrap;
}

.recording-button.start {
    background: #ef4444;
    color: white;
}

.recording-button.stop {
    background: #facc15;
    color: #111;
}

.recording-button:disabled {
    opacity: 0.55;
    cursor: wait;
}

@media (max-width: 1050px) {
    .recording-panel {
        grid-template-columns: 1fr;
    }

    .recording-button {
        width: 100%;
    }
}

@media (max-width: 650px) {
    .match-setup {
        grid-template-columns: 1fr;
    }

    .match-v {
        text-align: center;
        padding: 0;
    }
}

.match-quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 18px;
}

.delete-full-button {
    border: 1px solid #f87171;
    background: transparent;
    color: #f87171;
    padding: 10px 14px;
    border-radius: 9px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}

.delete-full-button:hover {
    background: rgba(248, 113, 113, 0.1);
}

.match-quick-actions a {
    text-decoration: none;
    padding: 10px 14px;
    border-radius: 9px;
    font-weight: 800;
}

.match-feature {
    background: var(--panel);
    border: 2px solid var(--accent);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 24px;
}

.match-feature-header {
    padding: 16px 18px;
    background: var(--panel2);
}

.match-feature-title {
    font-size: 24px;
    font-weight: 900;
    color: var(--accent);
}

.match-feature-subtitle {
    margin-top: 4px;
    color: var(--muted);
}

.match-feature video {
    width: 100%;
    display: block;
    background: #000;
    max-height: 70vh;
}

.match-feature-actions {
    display: flex;
    gap: 10px;
    padding: 15px;
}

.match-feature-actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    border-radius: 9px;
    font-weight: 800;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(310px, 1fr));
    gap: 18px;
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
}

.video-wrap {
    background: #000;
    aspect-ratio: 16 / 9;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.card-body {
    padding: 15px;
}

.event-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.event {
    font-size: 22px;
    font-weight: 900;
}

.event.FOUR {
    color: #38bdf8;
}

.event.SIX {
    color: var(--accent);
}

.event.WICKET {
    color: #f87171;
}

.time {
    color: var(--muted);
    font-size: 14px;
}

.description {
    margin-top: 7px;
    font-size: 16px;
    font-weight: 600;
}

.filename {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
    word-break: break-all;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

.actions a {
    flex: 1;
    text-align: center;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 9px;
    font-weight: 800;
}

.play {
    background: var(--green);
    color: #07130a;
}

.download {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
}

.trim-highlight-button {
    flex: 1;
    border: 1px solid #facc15;
    border-radius: 9px;
    padding: 10px 12px;
    background: transparent;
    color: #facc15;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}

.trim-highlight-button:hover {
    background: rgba(250, 204, 21, 0.12);
}

.empty {
    padding: 50px 20px;
    text-align: center;
    background: var(--panel);
    border-radius: 14px;
    color: var(--muted);
}

@media (max-width: 600px) {
    main {
        padding: 14px;
    }

    header {
        padding: 16px;
    }

    .brand {
        font-size: 24px;
    }
}

/* SCOREOS shared four-section navigation */
.scoreos-primary-nav,
.scoreos-section-nav {
    width: 100%;
    display: flex !important;
    justify-content: center !important;
    align-items: center;
    flex-wrap: wrap !important;
    gap: 8px !important;
    margin: 0 !important;
    padding: 8px 12px !important;
}

.scoreos-primary-nav {
    background: #101714 !important;
    border-bottom: 3px solid #d8b23f !important;
}

.scoreos-section-nav {
    background: #edf1ef !important;
    border-bottom: 1px solid #c8d0cc !important;
}

.scoreos-primary-nav a,
.scoreos-section-nav a {
    display: inline-block;
    border: 1px solid #718078 !important;
    border-radius: 8px !important;
    padding: 8px 13px !important;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px !important;
    font-weight: 800 !important;
    line-height: 1.15;
    text-decoration: none !important;
    white-space: nowrap;
}

.scoreos-primary-nav a {
    background: #222b27 !important;
    color: white !important;
}

.scoreos-section-nav a {
    background: white !important;
    color: #17221c !important;
}

.scoreos-primary-nav a.active,
.scoreos-section-nav a.active {
    background: #18743a !important;
    border-color: #18743a !important;
    color: white !important;
}

.scoreos-primary-nav a:hover,
.scoreos-section-nav a:hover {
    border-color: #d8b23f !important;
}

header .scoreos-primary-nav {
    margin-top: 12px !important;
}

header .scoreos-section-nav {
    margin-top: 7px !important;
}

@media (max-width: 680px) {
    .scoreos-primary-nav,
    .scoreos-section-nav {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .scoreos-primary-nav a,
    .scoreos-section-nav a {
        text-align: center;
    }
}


.media-status-overview {
    display: grid;
    grid-template-columns:
        minmax(0, 1.35fr)
        minmax(300px, 0.65fr);
    align-items: stretch;
    gap: 14px;
    margin-bottom: 18px;
}

.media-status-overview .camera-status-panel,
.media-status-overview .storage-panel {
    margin-bottom: 0;
}

@media (max-width: 850px) {
    .media-status-overview {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            SCOREOS <span>HIGHLIGHTS</span>
        </div>

        <div class="subtitle">
            Automatic match clips from FOURs, SIXes and WICKETs
        </div>

<nav class="scoreos-primary-nav" aria-label="Main navigation">
    <a href="/dashboard">Dashboard</a>
    <a href="/control">Match Control</a>
    <a class="active" href="/highlights">Camera & Highlights</a>
    <a href="/groundcontrol">System</a>
</nav>
<nav class="scoreos-section-nav" aria-label="Section navigation">
    <a href="/tv-camera">Live Camera</a>
    <a class="active" href="/highlights">Highlights</a>
</nav>
    </div>
</header>

<main>

    <div class="toolbar">
        <div
            class="summary"
            id="summary"
        >
            Loading highlights…
        </div>

        <div class="filters">
            <button
                class="filter active"
                data-filter="ALL"
            >
                All
            </button>

            <button
                class="filter"
                data-filter="FOUR"
            >
                Fours
            </button>

            <button
                class="filter"
                data-filter="SIX"
            >
                Sixes
            </button>

            <button
                class="filter"
                data-filter="WICKET"
            >
                Wickets
            </button>
        </div>
    </div>

    <div class="media-status-overview">
        <section
            id="camera-status-panel"
            class="camera-status-panel"
        >
            Checking camera…
        </section>

        <section
            id="storage-panel"
            class="storage-panel"
        >
            Loading storage information…
        </section>
    </div>

<section class="recording-panel">
    <div class="recording-info">
        <div class="recording-title">
            Full Match Recording
        </div>

        <div
            id="recording-status"
            class="recording-status"
        >
            Checking recording status…
        </div>

        <div
            id="recording-match-name"
            class="recording-match-name"
        ></div>
    </div>

    <div
        id="match-setup"
        class="match-setup"
    >
        <div class="team-field">
            <label for="home-team">
                Home Team
            </label>

            <input
                id="home-team"
                type="text"
                placeholder="Home team"
                value="Sutton CC"
            >
        </div>

        <div class="match-v">
            v
        </div>

        <div class="team-field">
            <label for="away-team">
                Away Team
            </label>

            <input
                id="away-team"
                type="text"
                placeholder="Away team"
            >
        </div>
    </div>

    <button
        id="recording-button"
        class="recording-button start"
        type="button"
        onclick="toggleMatchRecording()"
    >
        🔴 START MATCH RECORDING
    </button>
</section>

<div id="full-match"></div>

<div id="match-highlight"></div>

    <div id="content"></div>

</main>

<script>
let matches = [];
let unassigned = [];
let storage = null;
let currentFilter = "ALL";
let selectedMatchId = null;
let selectedMatchView = null;
let matchRecording = false;
let matchDayReady = false;

function prettyName(item) {
    const stem = item.filename
        .replace(/\.mp4$/i, "");

    const parts = stem.split("_");

    if (parts.length < 5) {
        return item.filename;
    }

    const person = parts
        .slice(3, -1)
        .join(" ")
        .replaceAll("-", " ")
        .replace(
            /\b\w/g,
            character => character.toUpperCase()
        );

    const score = parts[parts.length - 1];

    if (item.event_type === "WICKET") {
        return person === "Unknown Batter"
            ? "Wicket"
            : person + " — Wicket";
    }

    return person + " — " + score;
}

function prettyTime(item) {
    const date = new Date(
        item.modified * 1000
    );

    return date.toLocaleString(
        undefined,
        {
            dateStyle: "medium",
            timeStyle: "short",
        }
    );
}

function renderFullMatch() {
    const container = document.getElementById(
        "full-match"
    );

    if (!fullMatch) {
        container.innerHTML = "";
        return;
    }

    container.innerHTML = `
        <section class="match-feature">

            <div class="match-feature-header">
                <div class="match-feature-title">
                    🎥 FULL MATCH
                </div>

                <div class="match-feature-subtitle">
                    Complete match recording
                    — ${fullMatch.session_id}
                </div>
            </div>

            <video
                controls
                preload="metadata"
                src="${fullMatch.video_url}"
            ></video>

            <div class="match-feature-actions">

                <a
                    class="play"
                    href="${fullMatch.video_url}"
                    target="_blank"
                >
                    Play Full Match
                </a>

                <a
                    class="download"
                    href="${fullMatch.download_url}"
                >
                    Download Full Match
                </a>

            </div>

        </section>
    `;
}


function renderClipCard(item) {
    return `
        <article class="card">

            <div class="video-wrap">
                <video
                    controls
                    preload="metadata"
                    src="${item.video_url}"
                ></video>
            </div>

            <div class="card-body">

                <div class="event-row">
                    <div
                        class="event ${item.event_type}"
                    >
                        ${item.event_type}
                    </div>

                    <div class="time">
                        ${prettyTime(item)}
                    </div>
                </div>

                <div class="description">
                    ${prettyName(item)}
                </div>

                <div class="filename">
                    ${item.filename}
                </div>

                <div class="actions">
                    <a
                        class="play"
                        href="${item.video_url}"
                        target="_blank"
                    >
                        Play
                    </a>

                    <button
                        class="trim-highlight-button"
                        type="button"
                        onclick="trimHighlight('${item.filename}')"
                    >
                        ✂ Trim
                    </button>

                    ${
                        item.can_undo_trim
                        ? `
                            <button
                                class="trim-highlight-button"
                                type="button"
                                onclick="undoTrimHighlight('${item.filename}')"
                            >
                                ↶ Undo
                            </button>
                        `
                        : ""
                    }

                    <a
                        class="download"
                        href="${item.download_url}"
                    >
                        Download
                    </a>
                </div>

            </div>

        </article>
    `;
}


function renderFeature(item, title, subtitle, playText) {
    if (!item) {
        return "";
    }

    return `
        <section class="match-feature">

            <div class="match-feature-header">
                <div class="match-feature-title">
                    ${title}
                </div>

                <div class="match-feature-subtitle">
                    ${subtitle}
                </div>
            </div>

            <video
                controls
                preload="metadata"
                src="${item.video_url}"
            ></video>

            <div class="match-feature-actions">

                <a
                    class="play"

function formatBytes(bytes) {
    const value = Number(bytes || 0);

    if (value < 1024) {
        return value + " B";
    }

    if (value < 1024 * 1024) {
        return (
            value / 1024
        ).toFixed(1) + " KB";
    }

    if (value < 1024 * 1024 * 1024) {
        return (
            value / (1024 * 1024)
        ).toFixed(1) + " MB";
    }

    return (
        value / (1024 * 1024 * 1024)
    ).toFixed(2) + " GB";
}


function matchTitle(match) {
    const fixture =
        match.match_name
        || match.session_id;

    if (!match.date) {
        return fixture;
    }

    const date = new Date(
        match.date + "T12:00:00"
    );

    if (Number.isNaN(date.getTime())) {
        return fixture;
    }

    return (
        fixture
        + " — "
        + date.toLocaleDateString(
            undefined,
            {
                dateStyle: "medium",
            }
        )
    );
}

function render() {
    const content = document.getElementById(
        "content"
    );

    if (!selectedMatchId) {
        renderMatchLibrary(content);
        return;
    }

    const match = matches.find(
        item =>
            item.session_id === selectedMatchId
    );

    if (!match) {
        selectedMatchId = null;
        selectedMatchView = null;
        renderMatchLibrary(content);
        return;
    }

    renderSelectedMatch(
        content,
        match
    );
}


function formatRecordingStart(session) {
    if (!session || !session.started_iso) {
        return "";
    }

    const date = new Date(session.started_iso);

    if (Number.isNaN(date.getTime())) {
        return session.started_iso;
    }

    return date.toLocaleTimeString(
        undefined,
        {
            hour: "2-digit",
            minute: "2-digit",
        }
    );
}


async function loadMatchRecordingStatus() {
    const status = document.getElementById(
        "recording-status"
    );

    const button = document.getElementById(
        "recording-button"
    );

    try {
        const response = await fetch(
            "/api/match/status",
            {
                cache: "no-store",
            }
        );

        const data = await response.json();

        matchRecording = Boolean(
            data.recording
        );

        if (matchRecording) {
            const started =
                formatRecordingStart(
                    data.session
                );

            const matchFinished = Boolean(
                data.session?.match_finished
            );

            status.classList.remove(
                "live",
                "finished"
            );

            button.classList.remove(
                "finished"
            );

            if (matchFinished) {
                status.textContent =
                    "🏁 MATCH FINISHED"
                    + (
                        started
                        ? " — recording since " + started
                        : ""
                    )
                    + " — recording is still running";

                status.classList.add(
                    "finished"
                );

                button.textContent =
                    "⏹ STOP & BUILD FULL MATCH";

                button.classList.add(
                    "finished"
                );

            } else {
                status.textContent =
                    "● RECORDING"
                    + (
                        started
                        ? " — started " + started
                        : ""
                    );

                status.classList.add("live");
            }

            const setup = document.getElementById(
                "match-setup"
            );

            const matchName = document.getElementById(
                "recording-match-name"
            );

            if (setup) {
                setup.style.display = "none";
            }

            if (matchName) {
                matchName.textContent =
                    data.session?.match_name || "";
            }

            if (!data.session?.match_finished) {
                button.textContent =
                    "⏹ STOP MATCH RECORDING";
            }

            button.classList.remove("start");
            button.classList.add("stop");

        } else {
            status.textContent =
                "Not currently recording";

            status.classList.remove("live");

            const setup = document.getElementById(
                "match-setup"
            );

            const matchName = document.getElementById(
                "recording-match-name"
            );

            if (setup) {
                setup.style.display = "";
            }

            if (matchName) {
                matchName.textContent = "";
            }

            if (matchDayReady) {
                button.textContent =
                    "🔴 START MATCH RECORDING";
                button.disabled = false;
            } else {
                button.textContent =
                    "🔒 MATCH DAY NOT READY";
                button.disabled = true;
            }

            button.classList.remove("stop");
            button.classList.add("start");
        }

    } catch (error) {
        console.error(error);

        status.textContent =
            "Recording status unavailable";
    }
}


async function toggleMatchRecording() {
    const button = document.getElementById(
        "recording-button"
    );

    button.disabled = true;

    const endpoint = matchRecording
        ? "/api/match/stop"
        : "/api/match/start";

    const homeTeam = document.getElementById(
        "home-team"
    ).value.trim();

    const awayTeam = document.getElementById(
        "away-team"
    ).value.trim();

    if (
        !matchRecording
        && (!homeTeam || !awayTeam)
    ) {
        alert(
            "Please enter both teams before starting the match."
        );

        button.disabled = false;
        return;
    }

    const requestBody = matchRecording
        ? {}
        : {
            home_team: homeTeam,
            away_team: awayTeam,
        };

    try {
        const response = await fetch(
            endpoint,
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify(
                    requestBody
                ),
                cache: "no-store",
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                data.error
                || "Recording action failed"
            );
        }

        await loadMatchRecordingStatus();

    } catch (error) {
        console.error(error);

        alert(
            "Match recording failed: "
            + error.message
        );

    } finally {
        button.disabled = false;
    }
}

async function trimHighlight(filename) {
    const startInput = prompt(
        "Seconds to remove from the START:",
        "0"
    );

    if (startInput === null) {
        return;
    }

    const endInput = prompt(
        "Seconds to remove from the END:",
        "5"
    );

    if (endInput === null) {
        return;
    }

    const trimStart = Number(startInput);
    const trimEnd = Number(endInput);

    if (
        !Number.isFinite(trimStart)
        || !Number.isFinite(trimEnd)
        || trimStart < 0
        || trimEnd < 0
    ) {
        alert(
            "Please enter valid numbers "
            + "of seconds."
        );
        return;
    }

    if (
        trimStart === 0
        && trimEnd === 0
    ) {
        alert("Nothing selected to trim.");
        return;
    }

    const confirmed = confirm(
        "Trim this highlight?\n\n"
        + "Remove from start: "
        + trimStart
        + " seconds\n"
        + "Remove from end: "
        + trimEnd
        + " seconds\n\n"
        + "The original will be kept "
        + "as a safety backup."
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            "/api/highlights/trim",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify(
                    {
                        filename: filename,
                        trim_start: trimStart,
                        trim_end: trimEnd,
                    }
                ),
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                data.error
                || "Trim failed"
            );
        }

        alert(
            "Highlight trimmed successfully."
        );

        await loadHighlights();

    } catch (error) {
        alert(
            "Unable to trim highlight: "
            + error.message
        );
    }
}


async function buildMatchHighlights(
    sessionId,
    matchDate
) {
    const match = matches.find(
        item => item.session_id === sessionId
    );

    if (!match) {
        alert("Match not found.");
        return;
    }

    if (!matchDate) {
        alert(
            "Unable to determine the match date."
        );
        return;
    }

    const action =
        match.match_highlights
            ? "Rebuild"
            : "Build";

    const confirmed = confirm(
        action
        + " the combined highlights package?\n\n"
        + (
            match.match_name
            || sessionId
        )
        + "\n\n"
        + "Individual highlight clips will be kept."
    );

    if (!confirmed) {
        return;
    }

    try {
        const response = await fetch(
            "/api/highlights/build-match",
            {
                method: "POST",
                headers: {
                    "Content-Type":
                        "application/json",
                },
                body: JSON.stringify({
                    session_id: sessionId,
                    date: matchDate,
                }),
            }
        );

        const data = await response.json();

        if (
            !response.ok
            || data.ok === false
        ) {
            throw new Error(
                data.error
                || "Unable to build highlights"
            );
        }

        alert(
            "Combined highlights package ready."
        );

        await loadHighlights();

        const refreshed = matches.find(
            item => item.session_id === sessionId
        );

        if (refreshed) {
            selectedMatchId = sessionId;
            selectedMatchView = null;
            render();
        }

    } catch (error) {
        alert(
            "Unable to build highlights: "
            + error.message
        );
    }
}

    }
}


function renderStorage() {
    const panel = document.getElementById(
        "storage-panel"
    );

    if (!panel) {
        return;
    }

    if (!storage) {
        panel.textContent =
            "Storage information unavailable";
        return;
    }

    const free = formatBytes(
        storage.disk_free_bytes
    );

    const total = formatBytes(
        storage.disk_total_bytes
    );

    const recordings = formatBytes(
        storage.recordings_bytes
    );

    const highlightsSize = formatBytes(
        storage.highlights_bytes
    );

    const buffer = formatBytes(
        storage.buffer_bytes
    );

    panel.classList.remove(
        "warning",
        "critical"
    );

    if (storage.level === "warning") {
        panel.classList.add("warning");
    }

    if (storage.level === "critical") {
        panel.classList.add("critical");
    }

    panel.innerHTML = `
        <div>
            ${
                storage.level === "critical"
                ? "🔴 CRITICAL STORAGE"
                : storage.level === "warning"
                ? "⚠️ LOW STORAGE"
                : "💾 Storage"
            }
            — ${free} free of ${total}
            (${storage.disk_used_percent}% used)
        </div>

        <div class="storage-detail">
            Recordings: ${recordings}
            • Highlights: ${highlightsSize}
            • Buffer: ${buffer}
        </div>
    `;
}


async function loadCameraStatus() {
    const panel = document.getElementById(
        "camera-status-panel"
    );

    if (!panel) {
        return;
    }

    try {
        const response = await fetch(
            "/api/camera/status",
            {
                cache: "no-store",
            }
        );

        const data = await response.json();

        matchDayReady = Boolean(
            data.connected
            && data.buffering
            && data.highlight_worker
            && !data.recording
            && !data.recorder_service
        );

        panel.classList.remove(
            "ready",
            "recording",
            "offline",
            "reconnecting"
        );

        const camera =
            data.connected
            ? "🟢 Camera Connected"
            : "🔴 Camera Offline";

        const buffer =
            data.buffering
            ? "🟢 Pre-Roll Buffer Ready"
            : (
                data.recording
                ? "⚪ Pre-Roll Paused During Recording"
                : data.buffer_service
                ? "🔴 Pre-Roll Buffer Not Ready"
                : "🔴 Pre-Roll Buffer Service Stopped"
            );

        const worker =
            data.highlight_worker
            ? "🟢 Highlight Worker Running"
            : "🔴 Highlight Worker Stopped";

        const recorder =
            data.recording
            ? "🔴 Match Recording"
            : (
                data.recorder_service
                ? "🟠 Recorder Reconnecting"
                : "⚪ Not Recording"
            );

        let heading = "MATCH DAY STATUS";

        if (data.state === "recording") {
            heading = "🔴 MATCH RECORDING";
            panel.classList.add("recording");

        } else if (data.state === "ready") {
            heading = "🟢 MATCH DAY READY";
            panel.classList.add("ready");

        } else if (data.state === "reconnecting") {
            heading = "🟠 CAMERA RECONNECTING";
            panel.classList.add("reconnecting");

        } else if (data.state === "offline") {
            heading = "🔴 CAMERA OFFLINE";
            panel.classList.add("offline");

        } else if (data.state === "not_configured") {
            heading = "🔴 CAMERA NOT CONFIGURED";
            panel.classList.add("offline");

        } else {
            heading = "🟡 CAMERA ONLINE — BUFFER NOT READY";
            panel.classList.add("offline");
        }

        panel.innerHTML = `
            <div style="
                font-size: 18px;
                margin-bottom: 8px;
            ">
                ${heading}
            </div>

            <div style="
                color: var(--text);
                font-size: 14px;
                line-height: 1.8;
            ">
                ${camera}<br>
                ${buffer}<br>
                ${worker}<br>
                ${recorder}
            </div>
        `;

        await loadMatchRecordingStatus();

    } catch (error) {
        console.error(error);

        matchDayReady = false;

        panel.innerHTML = `
            <div style="font-size:18px;">
                🔴 MATCH DAY STATUS UNAVAILABLE
            </div>
        `;

        panel.classList.add("offline");
    }
}

async function loadHighlights() {
    try {
        const response = await fetch(
            "/api/highlights",
            {
                cache: "no-store",
            }
        );

        const data = await response.json();

        if (!data.ok) {
            throw new Error(
                "Highlights API returned an error"
            );
        }

        matches = data.matches || [];
        unassigned = data.unassigned || [];
        storage = data.storage || null;

        renderStorage();
        render();

    } catch (error) {
        console.error(error);

        document.getElementById(
            "summary"
        ).textContent =
            "Highlights unavailable";

        document.getElementById(
            "content"
        ).innerHTML = `
            <div class="empty">
                Unable to load highlights.
            </div>
        `;
    }
}

document
    .querySelectorAll(".filter")
    .forEach(button => {
        button.addEventListener(
            "click",
            () => {
                document
                    .querySelectorAll(".filter")
                    .forEach(item =>
                        item.classList.remove(
                            "active"
                        )
                    );

                button.classList.add(
                    "active"
                );

                currentFilter =
                    button.dataset.filter;

                render();
            }
        );
    });

loadHighlights();
loadMatchRecordingStatus();
loadCameraStatus();

setInterval(
    loadHighlights,
    10000
);

setInterval(
    loadMatchRecordingStatus,
    5000
);

setInterval(
    loadCameraStatus,
    5000
);
</script>

</body>
</html>
