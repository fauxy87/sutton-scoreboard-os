* {

}

html,

body {

/* SCOREOS broadcast camera layout */

.screen-layout.split-mode,

    min-height: 100vh;
    overflow: hidden;
    background: #000;
}

.camera-panel,
.split-mode .camera-panel,
.camera-mode .camera-panel {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    display: block !important;
    background: #000;
}

.camera-preview,

    height: 100%;
    min-height: 100%;

    background: #000;

<script>
let lastBroadcastEventTimestamp = null;
let broadcastEventQueue = [];
let broadcastEventShowing = false;

function queueBroadcastEvent(event) {
    if (!event || !event.timestamp) {
        return;
    }

    const alreadyQueued =
        broadcastEventQueue.some(
            item => item.timestamp === event.timestamp
        );

    if (alreadyQueued) {
        return;
    }

    broadcastEventQueue.push(event);
    playNextBroadcastEvent();
}

function playNextBroadcastEvent() {
    if (
        broadcastEventShowing ||
        broadcastEventQueue.length === 0
    ) {
        return;
    }

    const event =
        broadcastEventQueue.shift();

    broadcastEventShowing = true;

    showBroadcastEvent(event);

    setTimeout(
        () => {
            broadcastEventShowing = false;
            playNextBroadcastEvent();
        },
        3500
    );
}

async function pollBroadcastEvents() {
    try {
        const response = await fetch(
            "/api/events",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const events =
            Array.isArray(data.events)
                ? data.events
                : [];

        if (events.length === 0) {
            return;
        }

        events.sort(
            (a, b) =>
                Number(a.timestamp || 0) -
                Number(b.timestamp || 0)
        );

        if (
            lastBroadcastEventTimestamp === null
        ) {
            lastBroadcastEventTimestamp =
                Number(
                    events[
                        events.length - 1
                    ].timestamp
                );

            return;
        }

        const unseenEvents =
            events.filter(
                event =>
                    Number(event.timestamp) >
                    Number(
                        lastBroadcastEventTimestamp
                    )
            );

        for (const event of unseenEvents) {
            if (
                event.type === "FOUR" ||
                event.type === "SIX" ||
                event.type === "WICKET"
            ) {
                queueBroadcastEvent(event);
            }

            lastBroadcastEventTimestamp =
                Math.max(
                    Number(
                        lastBroadcastEventTimestamp
                    ),
                    Number(event.timestamp)
                );
        }

    } catch (error) {
        console.error(
            "Event polling failed:",
            error
        );
    }
}

pollBroadcastEvents();

setInterval(
    pollBroadcastEvents,
    750
);
</script>

<script>
function cleanScore(value, fallback = "0") {
    if (value === null || value === undefined) {
        return fallback;
    }

    const text = String(value).trim();

    if (!text || text === "---") {
        return fallback;
    }

    const cleaned = text.replace(/^-+/, "");

    return cleaned || fallback;
}

function updateClock() {
    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("en-GB");
}

function setMode(mode) {
    const allowed = ["score", "camera", "split"];

    if (!allowed.includes(mode)) {
        mode = "split";
    }

    const layout =
        document.getElementById("screenLayout");

    layout.className =
        `screen-layout ${mode}-mode`;

    document
        .getElementById("scoreModeButton")
        .classList.toggle(
            "active",
            mode === "score"
        );

    document
        .getElementById("cameraModeButton")
        .classList.toggle(
            "active",
            mode === "camera"
        );

    document
        .getElementById("splitModeButton")
        .classList.toggle(
            "active",
            mode === "split"
        );

    localStorage.setItem(
        "scoreos-tv-mode",
        mode
    );

    const url =
        new URL(window.location.href);

    url.searchParams.set("mode", mode);

    window.history.replaceState(
        {},
        "",
        url
    );
}

function initialMode() {
    const params =
        new URLSearchParams(
            window.location.search
        );

    return (
        params.get("mode") ||
        localStorage.getItem("scoreos-tv-mode") ||
        "split"
    );
}

async function updateTV() {
    try {
        const response = await fetch(
            "/api/state",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const state = await response.json();

        const total =
            cleanScore(state.total);

        const wickets =
            cleanScore(state.wickets);

        const overs =
            cleanScore(state.overs);

        document
            .getElementById("score")
            .textContent =
                `${total}/${wickets}`;

        document
            .getElementById("overs")
            .textContent = overs;

        document
            .getElementById("batting-team")
            .textContent =
                state.BatTeamName ||
                "Batting Team";

        document
            .getElementById("fielding-team")
            .textContent =
                state.FieldTeamName ||
                "Fielding Team";

        document
            .getElementById("batter-a-name")
            .textContent =
                (
                    state.BatAStriker === "1"
                        ? "★ "
                        : ""
                ) +
                (
                    state.Bat1Name ||
                    "Batter A"
                );

        document
            .getElementById("batter-a-runs")
            .textContent =
                cleanScore(
                    state.BatAscore
                );

        document
            .getElementById("batter-a-balls")
            .textContent =
                `(${cleanScore(
                    state.BatABallsFaced
                )})`;

        document
            .getElementById("batter-b-name")
            .textContent =
                (
                    state.BatBStriker === "1"
                        ? "★ "
                        : ""
                ) +
                (
                    state.Bat2Name ||
                    "Batter B"
                );

        document
            .getElementById("batter-b-runs")
            .textContent =
                cleanScore(
                    state.BatBscore
                );

        document
            .getElementById("batter-b-balls")
            .textContent =
                `(${cleanScore(
                    state.BatBBallsFaced
                )})`;

        document
            .getElementById("bowler-name")
            .textContent =
                state.Bowler1Name ||
                "Bowler";

        document
            .getElementById("bowler-figures")
            .textContent =
                state.Bowler1Figures ||
                "0/0";

        document
            .getElementById("current-over")
            .textContent =
                state.CurrentOver ||
                "—";

        document
            .getElementById("last-wicket")
            .textContent =
                cleanScore(
                    state.LastWicket,
                    "—"
                );

        document
            .getElementById("runs-required")
            .textContent =
                cleanScore(
                    state.RunsRequired,
                    "—"
                );

        document
            .getElementById("target-display")
            .textContent =
                cleanScore(
                    state.target,
                    "—"
                );

        const targetValue = cleanScore(
            state.target,
            "—"
        );

        const runsRequiredValue = cleanScore(
            state.RunsRequired,
            "—"
        );

        document
            .getElementById("broadcast-chase")
            .style.display =
                targetValue === "—"
                    ? "none"
                    : "block";

    } catch (error) {
        console.error(
            "TV update failed:",
            error
        );
    }
}

const cameraPreview =
    document.getElementById(
        "cameraPreview"
    );

const cameraMessage =
    document.getElementById(
        "cameraMessage"
    );

const cameraBadge =
    document.getElementById(
        "cameraBadge"
    );

let cameraHealth = {
    videoLive: false,
    starting: false,
    reachable: false
};

async function updateCameraHealth() {
    try {
        const response = await fetch(
            "/api/camera/status",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const camera =
            await response.json();

        cameraHealth = {
            videoLive:
                camera.video_live === true,
            starting:
                camera.camera_starting === true,
            reachable:
                camera.connected === true
        };

        if (cameraHealth.videoLive) {
            cameraBadge.textContent =
                "● LIVE CAMERA";

            cameraMessage.style.display =
                "none";

            return;
        }

        if (cameraHealth.starting) {
            cameraBadge.textContent =
                "● CAMERA STARTING";

            cameraMessage.textContent =
                "CAMERA STARTING…";

            cameraMessage.style.display =
                "flex";

            return;
        }

        if (cameraHealth.reachable) {
            cameraBadge.textContent =
                "● CAMERA RECONNECTING";

            cameraMessage.textContent =
                "CAMERA RECONNECTING…";

            cameraMessage.style.display =
                "flex";

            return;
        }

        cameraBadge.textContent =
            "● CAMERA OFFLINE";

        cameraMessage.textContent =
            "CAMERA OFFLINE";

        cameraMessage.style.display =
            "flex";

    } catch (error) {
        cameraBadge.textContent =
            "● CAMERA STATUS UNKNOWN";

        cameraMessage.textContent =
            "CAMERA STATUS UNAVAILABLE";

        cameraMessage.style.display =
            "flex";
    }
}


let cameraReconnectTimer = null;
let cameraReconnectAttempts = 0;

function cameraPreviewUrl() {
    return (
        "/api/camera/preview?_=" +
        Date.now()
    );
}

function reconnectCameraPreview(delay = 2000) {
    if (cameraReconnectTimer) {
        clearTimeout(cameraReconnectTimer);
    }

    cameraMessage.textContent =
        "CAMERA RECONNECTING…";

    cameraMessage.style.display =
        "flex";

    cameraReconnectTimer = setTimeout(
        () => {
            cameraReconnectAttempts += 1;

            cameraPreview.src =
                cameraPreviewUrl();
        },
        delay
    );
}

cameraPreview.addEventListener(
    "load",
    () => {
        cameraReconnectAttempts = 0;

        if (cameraHealth.videoLive) {
            cameraMessage.style.display =
                "none";
        }
    }
);

cameraPreview.addEventListener(
    "error",
    () => {
        const delay = Math.min(
            2000 + (
                cameraReconnectAttempts * 1000
            ),
            10000
        );

        reconnectCameraPreview(delay);
    }
);

document
    .getElementById("fullscreen-btn")
    .addEventListener(
        "click",
        async () => {
            if (!document.fullscreenElement) {
                await document
                    .documentElement
                    .requestFullscreen();
            } else {
                await document
                    .exitFullscreen();
            }
        }
    );

setMode(initialMode());

updateClock();
setInterval(updateClock, 1000);

updateTV();
setInterval(updateTV, 1000);

updateCameraHealth();
setInterval(updateCameraHealth, 2000);
</script>

<script>
/*
 * Temporary TV event graphic.
 * The automatic event engine will drive this later.
 */
function showBroadcastEvent(event) {
    const panel =
        document.getElementById("broadcast-event");

    if (!panel || !event) {
        return;
    }

    const eventType =
        String(event.type || "").toUpperCase();

    const batter =
        String(event.batter || "").trim();

    const lastWicket =
        String(event.last_wicket || "").trim();

    panel.className = "broadcast-event";

    if (eventType === "WICKET") {
        panel.classList.add("wicket");
    } else if (eventType === "SIX") {
        panel.classList.add("six");
    }

    let detail = batter;

    if (
        eventType === "WICKET" &&
        lastWicket &&
        lastWicket !== "---"
    ) {
        detail = lastWicket;
    }

    panel.innerHTML = `
        <div class="broadcast-event-type">
            ${eventType}
        </div>

        ${
            detail
                ? `
                    <div class="broadcast-event-detail">
                        ${detail}
                    </div>
                  `
                : ""
        }
    `;

    panel.classList.add("show");

    clearTimeout(window.scoreosEventTimer);

    window.scoreosEventTimer = setTimeout(
        () => {
            panel.classList.remove("show");
        },
        3200
    );
}

</script>
